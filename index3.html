<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

  if (location.protocol === 'http:' || location.protocol === 'https:') {
    var _m = document.createElement('link');
    _m.rel = 'manifest'; _m.href = 'manifest3.webmanifest';
    document.head.appendChild(_m);
  }
</script>

<!-- 파비콘 설정 -->
<link rel="icon" type="image/png" sizes="192x192" href="icon5-192.png">

<title>병해충 진단 · 사진대조  제작:이용호 Copyright 2026-07-09</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F1; --panel:#FFFFFF; --ink:#1E2B22; --ink-soft:#4B5A4F;
  --line:#DCE4D5; --leaf:#2E6B3E; --leaf-d:#245331; --leaf-l:#E7F0E5;
  --amber:#E39B2E; --amber-l:#FBEFD6;
  --pest:#C24A3A; --pest-l:#F7E2DE;
  --shadow:0 1px 2px rgba(30,43,34,.06),0 8px 24px rgba(30,43,34,.06);
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55;
  -webkit-text-size-adjust:100%}
.wrap{max-width:940px;margin:0 auto;padding:20px 16px 80px}

.hdr {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 6px 4px 8px;
  position: relative;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 8px;
}

.hdr-content { flex: 1; padding-right: 130px; }
.hdr .title-area { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.leafmark { width: 30px; height: 30px; flex: none; }
.hdr h1 { font-family: 'Gowun Batang', serif; font-size: 24px; margin: 0; letter-spacing: -.5px; white-space: nowrap; }
.hdr h5 { font-size: 11px; color: var(--ink-soft); margin: 0 0 6px 0; font-weight: normal; line-height: 1.3; }
.hdr .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 4px 0; text-align: left; line-height: 1.4; }
.hdr .backapp { display: inline-block; font-size: 12px; font-weight: 700; text-decoration: none; color: var(--leaf-d); background: var(--leaf-l); border: 1px solid #c3ddc0; border-radius: 8px; padding: 4px 8px; vertical-align: top; }
.hdr .backapp:active { background: #d8e8d5; }

.hdr-qrcode { position: absolute; top: 0; right: 2px; flex-shrink: 0; }
.hdr-qrcode img { width: 120px; height: 120px; border: 1px solid #ddd; border-radius: 6px; display: block; }

/* 등록 농약 목록 — 보유 우선 표시 */
.rx-own-cnt{ color:#2E7D32; font-weight:700; }
.rx-sim-cnt{ color:#E65100; font-weight:700; }
.rx-alt-cnt{ color:#1565C0; font-weight:700; }
.rx-drop-cnt{ color:#9E9E9E; font-weight:600; }
.alt-badge{ background:#E3F2FD; color:#0D47A1; border:1px solid #64B5F6;
  font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; }
.pesti.alt{ border-color:#64B5F6; background:#F8FBFF; }
.cmp-note{ font-size:11px; margin-top:5px; line-height:1.6; color:#546E7A; }
.cmp-same{ color:#2E7D32; font-weight:700; }
.cmp-diff{ color:#C62828; font-weight:700; }
.cmp-unk { color:#9E9E9E; font-weight:600; }
.sim-badge{ background:#FFF3E0; color:#E65100; border:1px solid #FFB74D;
  font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; }
.pesti.similar{ border-color:#FFB74D; background:#FFFDF7; }
.sim-note{ font-size:11px; color:#E65100; margin-top:4px; line-height:1.5; }
.own-note{ font-size:11px; color:#9E9E9E; margin-top:4px; line-height:1.5; }
.rx-divider{
  display:flex; align-items:center; gap:8px;
  margin:14px 2px 8px; color:#9E9E9E; font-size:11px; font-weight:600;
}
.rx-divider::before,.rx-divider::after{
  content:''; flex:1; height:1px; background:#E0E0E0;
}

/* 작물 추가 입력칸 한 줄 최적화 스타일 */
.crop-manual{display:flex;gap:6px;margin:10px 0 4px;align-items:center;width:100%;}
.crop-manual input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--panel);height:36px;}
.crop-manual button{border:none;background:var(--leaf);color:#fff;border-radius:8px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;height:36px;white-space:nowrap;}

/* 작물상태 관리 및 방제계획 버튼 영역 스타일 */
#reviewBar { display: flex; gap: 6px; margin: 8px 0 14px 0; flex-wrap: wrap; }

.crops{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.crop{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;
  transition:.15s;line-height:1.2}
.crop:hover{border-color:var(--leaf)}
.crop.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.crop-wrap{display:inline-flex;align-items:stretch;gap:0}
.crop-wrap .crop{border-top-right-radius:0;border-bottom-right-radius:0}
.crop-pen{border:1.5px solid var(--line);border-left:none;background:var(--panel);
  border-radius:0 999px 999px 0;padding:0 10px;font-size:12px;cursor:pointer;
  color:var(--ink-soft);line-height:1;-webkit-tap-highlight-color:transparent}
.crop-pen:hover{background:var(--leaf-l);color:var(--leaf-d)}
.crop-pen:active{background:#d8e8d5}

.tabs{display:flex;gap:4px;margin:18px 0 12px;background:var(--leaf-l);
  padding:4px;border-radius:12px;width:fit-content}
.tab{border:none;background:transparent;padding:8px 18px;border-radius:9px;
  font:inherit;font-weight:700;color:var(--leaf-d);cursor:pointer}
.tab.on{background:var(--panel);box-shadow:var(--shadow)}
.tab.pest.on{color:var(--pest)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:.15s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);border-color:var(--leaf)}
.card .thumb{aspect-ratio:4/3;background:var(--leaf-l);position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--leaf);opacity:.4;font-size:12px}
.card .body{padding:10px 12px}
.card .nm{font-weight:700;font-size:15px;letter-spacing:-.3px}
.card .en{font-size:11px;color:var(--ink-soft);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:14px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--leaf);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{background:var(--amber-l);border:1px solid #EAD6A6;border-radius:12px;
  padding:12px 14px;font-size:13px;color:#6b5215;margin:14px 0}

.sheet-bg{position:fixed;inset:0;background:rgba(20,30,24,.5);backdrop-filter:blur(2px);
  display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:940px;max-height:94vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:18px 16px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;
  background:var(--bg);padding-top:6px;margin:-6px -2px 12px;z-index:2}
.sheet-hd .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
  background:var(--leaf-l);color:var(--leaf-d)}
.sheet-hd .tag.pest{background:var(--pest-l);color:var(--pest)}
.sheet-hd h2{font-family:'Gowun Batang',serif;font-size:22px;margin:0}
.sheet-hd .x{margin-left:auto;border:none;background:var(--line);width:34px;height:34px;
  border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px;box-shadow:var(--shadow);min-width:0}
.col h3{margin:0 0 8px;font-size:12px;letter-spacing:.2px;color:var(--ink-soft);
  display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.col h3 b{color:var(--leaf-d)}
.myphoto{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;
  color:var(--ink-soft);font-size:12px;cursor:pointer;overflow:hidden;background:var(--leaf-l)}
.myphoto img{width:100%;height:100%;object-fit:cover}
.refmain{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--leaf-l);
  border:1px solid var(--line)}
.refmain img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph2{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--leaf);opacity:.55;font-size:12px;text-align:center;padding:6px}
.refthumbs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.refthumbs img{height:56px;width:56px;object-fit:cover;border-radius:8px;flex:none;
  cursor:zoom-in;border:1px solid var(--line);background:var(--leaf-l)}

.info{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.info h4{margin:0 0 8px;font-size:14px;color:var(--leaf-d);display:flex;align-items:center;gap:7px}
.info h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--amber)}
.info p{margin:0;font-size:14px;color:var(--ink);white-space:pre-wrap}
.checks li{list-style:none;display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.checks{margin:0;padding:0}
.checks li:last-child{border:none}
.checks input{margin-top:4px;width:17px;height:17px;accent-color:var(--leaf)}

.handoff{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 4px;margin-top:6px}
.btn-rx{width:100%;border:none;background:var(--leaf);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:15px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.btn-rx:active{background:var(--leaf-d)}

.rx-bg{position:fixed;inset:0;background:rgba(20,30,24,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
.rx-bg.on{display:flex}
.rx{background:var(--bg);width:100%;max-width:940px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 30px}
.rx-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rx-hd h2{font-family:'Gowun Batang',serif;font-size:20px;margin:0}
.rx-hd .x{margin-left:auto;border:none;background:var(--line);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.rx-sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.rx-sub b{color:var(--leaf-d)}

.foot{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:30px;line-height:1.7}
.foot a{color:var(--leaf-d)}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:90;align-items:center;justify-content:center;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:94vh;border-radius:8px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;
  border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:100;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.crop-edit {
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px;
  padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  color: var(--leaf-d); background-color: var(--leaf-l); line-height: 1.4; vertical-align: middle; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
}
.crop-edit:active { background: #d8e8d5; }
.back { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; color: var(--leaf-d); }
.back.prim { background: var(--leaf); border-color: var(--leaf); color: #fff; font-weight: 700; }
.choice { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; font: inherit; }
.choice b { display: block; font-size: 15px; margin-bottom: 3px; }
.choice span { font-size: 12px; color: var(--ink-soft); }
.choice:hover { border-color: var(--leaf); }
.spray { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.spray:last-child { border: none; }
.spray input { width: 20px; height: 20px; accent-color: var(--leaf); flex: none; }
.pesti { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.pesti .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pesti .brand { font-weight: 700; font-size: 15px; }
.pesti .use { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--leaf-l); color: var(--leaf-d); }
.pesti .use.살충 { background: var(--pest-l); color: var(--pest); }
.pesti .meta { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.pesti.owned { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset, var(--shadow); }
.own-badge { font-size: 11px; font-weight: 700; color: #6b5215; background: var(--amber-l); border: 1px solid #EAD6A6; padding: 2px 8px; border-radius: 6px; }
.own-sep { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 14px 2px 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
.buy-badge { font-size: 11px; font-weight: 700; color: var(--pest); background: var(--pest-l); border: 1px solid #e6b3a8; padding: 2px 8px; border-radius: 6px; }
.rec-badge { font-size: 11px; font-weight: 700; color: #6b5215; background: var(--amber-l); border: 1px solid #EAD6A6; padding: 2px 8px; border-radius: 6px; }
.pesti.rec { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset, var(--shadow); }
.tox-badge { font-size: 11px; font-weight: 700; color: var(--ink-soft); background: #eef1ec; border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
.tox-badge.low { color: var(--leaf-d); background: var(--leaf-l); border-color: #c3ddc0; }

.webbox h4 span.unoff { font-size: 11px; font-weight: 700; color: #7a2f22; background: #F7E2DE; padding: 2px 8px; border-radius: 6px; margin-left: 2px; }
.webbtn { border: 1.5px solid var(--leaf); background: var(--panel); color: var(--leaf-d); border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
.webbtn:hover { background: var(--leaf-l); }
.webstrip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.webstrip img { height: 104px; width: 104px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; background: var(--leaf-l); }
.webstrip .src { width: 100%; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

#embedCrop { align-items: center; gap: 8px; margin: 2px 2px 10px; font-weight: 700; font-size: 16px; display: none; }
#embedCrop .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--leaf-l); color: var(--leaf-d); }
#embedCrop .chg-btn { margin-left: auto; font: inherit; font-size: 12px; font-weight: 700; color: var(--leaf-d); background: var(--leaf-l); border: 1px solid #c3ddc0; border-radius: 8px; padding: 5px 10px; cursor: pointer; }

.cropcat { font-size: 13px; font-weight: 700; color: var(--leaf-d); margin: 10px 2px 8px; display: flex; align-items: center; gap: 6px; }
.cropcat .cnt { font-weight: 500; color: var(--ink-soft); font-size: 12px; }
.crops-row { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 헤더 영역 (밑줄 선 포함) -->
  <div class="hdr">
	  <div class="hdr-content">
	    <div class="title-area">
	      <svg class="leafmark" viewBox="0 0 40 40" fill="none">
	        <path d="M20 4C10 8 6 18 8 30c12 4 22-2 24-14C33 8 27 5 20 4Z" fill="#2E6B3E"/>
	        <path d="M14 26C18 20 24 16 30 14" stroke="#E7F0E5" stroke-width="2" stroke-linecap="round"/>
	      </svg>
	      <h1>병해충 진단 · 방제</h1>
	    </div>
	    <h5>제작: 이용호 &nbsp; Copyright 2026.07.10. All Right Reserved</h5>
	    <div class="sub">내 밭 작물을 골라 진단 → 처방 → 방제</div>
	    <a class="backapp" href="https://solt4999b1-cell.github.io/orchard/index1.html">← 관리앱으로 가기</a>  
	  </div>
	  <div class="hdr-qrcode">
	    <a href="https://solt4999b1-cell.github.io/orchard/index3.html" target="_blank">
	      <img src="./2cp8s.png" alt="QR코드">
	    </a>
	  </div>
	</div>

  <!-- 1순위: 헤더 하단선 바로 아래에 위치한 '작물 추가' 입력란 영역 -->
  <div id="cropPick">
    <div id="cropManualWrap">
      <div class="crop-manual">
        <input id="cropInput" list="stdCrops" placeholder="새 작물 추가 (목록 선택/입력)"
               onkeydown="if(event.key==='Enter'){CropManager.addCrop();}">
        <button onclick="CropManager.addCrop()">작물 추가</button>
      </div>
      <div style="font-size:11px;color:var(--ink-soft);margin:4px 2px 8px">
        표준 작물명을 선택하여 내 밭에 새로 추가하세요.
      </div>
    </div>
    
    <!-- 2순위: 그 바로 아래에 위치한 '작물상태 관리' 및 '방제계획' 버튼 영역 -->
    <div id="reviewBar">
      <button class="crop-edit" onclick="CropManager.open()">🌱 작물상태 관리</button>
      <button class="crop-edit" onclick="Plan.review()">📋 방제계획·실행체크</button>
    </div>

    <!-- 3순위: 🌳 유실수 및 채소 목록 영역 (작물 추가 및 버튼들보다 아래에 위치) -->
    <div class="crops" id="crops">
    <div class="state" style="padding:16px">⏳ 작물 목록을 불러오는 중입니다…</div>
  </div>
  </div>

  <div id="embedCrop"></div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-type="sick" onclick="App.switchTab('sick')">🍂 병</button>
    <button class="tab pest" data-type="insect" onclick="App.switchTab('insect')">🐛 해충</button>
  </div>

window.addEventListener('unhandledrejection', function (ev) {
  var r = ev.reason;

  var fromExtension = /chrome-extension:\/\/|moz-extension:\/\/|safari-extension:\/\//.test(stack);

  console.group('%c⚠️ 처리되지 않은 Promise 오류',
                'color:#C62828;font-weight:bold');
  console.log('출처 판정:', fromExtension
    ? '🧩 브라우저 확장 프로그램 (이 앱과 무관 — 무시해도 됩니다)'
    : (stack === '(스택 없음)'

        : '📄 이 앱의 코드'));
  console.log('내용:', r);
  console.log('스택:', stack);
  console.groupEnd();
});

// 시트의 category / status 값을 표준으로 정리한다.
//   작물정리()      → 검사만 (아무것도 바꾸지 않음)
//   작물정리(true)  → 실제로 시트에 반영
window.작물정리 = window.fixCrops = async function(apply){
  const rows = await DB.list(CONFIG.plantsCollection);
  const bad = [];

  (rows||[]).forEach(p => {
    const name = p.name || '';
    if(!name) return;
    // 예전 데이터는 cat 열에만 값이 있을 수 있으므로 그것도 읽어 category 로 승격한다
    const curCat = String((p.category != null && String(p.category).trim()) ? p.category : (p.cat || '')).trim();
    const curSt  = String(p.status   == null ? '' : p.status  ).trim();
    const newCat = App.normCategory(curCat || p.cat, name);
    const newSt  = App.normStatus(curSt);
    const catBad = (curCat !== newCat);
    const stBad  = (curSt  !== newSt);
    if(catBad || stBad){
      bad.push({ id:p.id, name, curCat, newCat, curSt, newSt });
    }
  });

  console.log('%c🧹 작물 데이터 정리', 'color:#2E7D32;font-weight:bold');
  console.log(`전체 ${(rows||[]).length}건 중 손볼 것 ${bad.length}건`);
  if(bad.length) console.table(bad.map(b => ({
    작물: b.name,
    'category(현재)': b.curCat || '(빈칸)',
    'category(수정)': b.newCat,
    'status(현재)':   b.curSt  || '(빈칸)',
    'status(수정)':   b.newSt
  })));

  if(!bad.length){ console.log('✅ 정리할 것이 없습니다'); return; }

  if(!apply){
    console.log('%c검사만 했습니다. 실제로 반영하려면  작물정리(true)  를 입력하세요.',
                'color:#E65100;font-weight:bold');
    return bad;
  }

  console.log('시트에 반영 중… (건당 약 1초)');
  let ok = 0, fail = 0;
  for(const b of bad){
    try{
      await DB.update(CONFIG.plantsCollection, b.id,
                      { category: b.newCat, status: b.newSt });
      ok++;
    }catch(e){ fail++; console.warn('실패:', b.name, e.message); }
  }
  console.log(`✅ 완료 — 성공 ${ok}건, 실패 ${fail}건`);
  App._crops = await App.loadCrops();
  App.renderCrops();
};

window.농약대조 = window.checkPesticide = async function (keyword) {
  const rows = await DB.list(CONFIG.pesticidesCollection);
  const norm = s => String(s||'').replace(/[\s()·\-]/g,'').toLowerCase();
  const key  = norm(keyword||'');
  const hit  = key ? (rows||[]).filter(p => norm(p.name).indexOf(key)>=0 || key.indexOf(norm(p.name))>=0)
                   : (rows||[]);

  console.log(`%c💊 농약장 저장값 ${hit.length}건` + (keyword?` — '${keyword}' 검색`:''),
              'color:#1565C0;font-weight:bold');
  if(!hit.length){ console.warn('해당 이름의 농약이 없습니다'); return; }

  console.table(hit.map(p => ({
    상표명: p.name,
    '용도(type)':  p.type        || '(빈칸)',
    '용도 정규화':  Owned.normUse(p.type) || '(빈칸)',
    '회사':        p.manufacturer || '(빈칸)',
    '품목명':      p.ingredient   || '(빈칸)',
    수량: (p.quantity===''||p.quantity==null) ? '(빈칸)' : p.quantity
  })));
  console.log('%c※ PSIS 용도(살균/살충/제초…)와 「용도 정규화」 값이 같아야 보유로 잡힙니다.',
              'color:#E65100');
  return hit;
};

window.아이디검사 = window.auditIds = async function () {
  const rows = await DB.list(CONFIG.plantsCollection);
  if(!rows || !rows.length){ console.warn('데이터를 못 받았습니다'); return; }

  const blank = rows.filter(r => !String(r.id == null ? '' : r.id).trim());
  const byId = {};
  rows.forEach(r => {
    const k = String(r.id == null ? '' : r.id).trim();
    if(k) (byId[k] = byId[k] || []).push(r.name);
  });
  const dup = Object.keys(byId).filter(k => byId[k].length > 1)
                .map(k => ({ id:k, 겹치는작물: byId[k].join(', ') }));

  // 이름이 다른 이름의 앞부분인 쌍 — 이름으로 행을 찾을 때 헷갈릴 수 있다
  const names = rows.map(r => String(r.name || '').trim()).filter(Boolean);
  const prefix = [];
  names.forEach(a => names.forEach(b => {
    if(a !== b && b.startsWith(a)) prefix.push({ 짧은이름:a, 긴이름:b });
  }));

  console.log('%c🆔 작물 id 검사 (전체 ' + rows.length + '행)', 'color:#1565C0;font-weight:bold');

  if(blank.length){
    console.warn('⚠️ id 가 비어 있는 행 ' + blank.length + '건 — 수정 시 이름으로 찾게 되어 위험합니다');
    console.table(blank.map(r => ({ 작물:r.name, category:r.category, status:r.status })));
  } else console.log('%c✅ id 가 빈 행 없음', 'color:#2E7D32');

  if(dup.length){
    console.warn('⚠️ id 가 겹치는 행 ' + dup.length + '쌍 — 한쪽을 고치면 다른 쪽도 바뀝니다');
    console.table(dup);
  } else console.log('%c✅ id 중복 없음', 'color:#2E7D32');

  if(prefix.length){
    console.warn('⚠️ 이름이 앞부분만 같은 쌍 ' + prefix.length + '개 — id 가 정상이면 문제없습니다');
    console.table(prefix);
  }

  // 실제 저장된 값도 같이 보여준다
  const watch = rows.filter(r => prefix.some(p => p.짧은이름 === r.name || p.긴이름 === r.name));
  if(watch.length){
    console.log('%c▼ 해당 작물들의 현재 시트 값', 'font-weight:bold');
    console.table(watch.map(r => ({ id:r.id, name:r.name, category:r.category, cat:r.cat, status:r.status })));
  }
  return { blank, dup, prefix };
};

const AppBus = {
  _h:{},
  on(evt, fn){ (this._h[evt] ||= []).push(fn); return this; },
  emit(evt, data){ (this._h[evt]||[]).forEach(fn=>{ try{fn(data)}catch(e){console.error(e)} }); }
};

const DB = {
  // 이 GAS가 실제로 지원하는 action (콘솔 진단으로 확정됨)
  //   plants        → getPlants
  //   myPesticides  → getMyPesticides
  // 서버에 없는 컬렉션은 요청 자체를 건너뛴다 (요청 1건당 1~2초 소요)
  LOCAL_ONLY: ['cropNameOverrides'],

  // 각 action 이 GAS 안에서 실제로 여는 구글 시트 탭 이름
  //   getPlants        → growPlants   (doGet: gasGetRows('growPlants'))
  //   getMyPesticides  → myPesticides (doGet: gasGetRows('myPesticides'))
  SHEET_OF: {
    getPlants:       'growPlants',
    getMyPesticides: 'myPesticides',
    readCollection:  '(collectionName 로 지정)',
    read:            '(sheetName 로 지정)'
  },

  _readActions(collName){
    if(this.LOCAL_ONLY.includes(collName)) return [];
    if(collName === CONFIG.plantsCollection)     return [{ action:'getPlants' }];
    if(collName === CONFIG.pesticidesCollection) return [{ action:'getMyPesticides' }];
    // 그 밖의 컬렉션은 예전처럼 후보를 훑는다
    return [
      { action:'readCollection', collectionName: collName },
      { action:'read', sheetName: collName }
    ];
  },

  // GAS가 시트를 [[헤더],[행],[행]...] 2차원 배열로 넘기는 경우를 객체 배열로 변환
  _toObjects(rows){
    if(!Array.isArray(rows) || !rows.length) return rows || [];
    if(!Array.isArray(rows[0])) return rows;          // 이미 객체 배열이면 그대로

    const head = rows[0].map(h => String(h == null ? '' : h).trim());
    const out = [];
    for(let i=1; i<rows.length; i++){
      const r = rows[i];
      if(!Array.isArray(r)) { out.push(r); continue; }
      const o = {};
      for(let c=0; c<head.length; c++){ if(head[c]) o[head[c]] = r[c]; }
      out.push(o);
    }
    return out;
  },

  // 컬렉션 이름표를 plants → growPlants 로 바꾸면서
  // 예전 키(orchard.plants)에 남아 있는 캐시를 새 키로 한 번만 옮긴다.
  _migrateCacheKey(){
    try{
      if(localStorage.getItem('_orchardKeyMigrated_v1')) return;
      const oldV = localStorage.getItem('orchard.plants');
      if(oldV && !localStorage.getItem('orchard.growPlants')){
        localStorage.setItem('orchard.growPlants', oldV);
        console.log('🔁 캐시 이월: orchard.plants → orchard.growPlants');
      }
      localStorage.setItem('_orchardKeyMigrated_v1', '1');
    }catch(e){}
  },

  async list(collName){
    this._migrateCacheKey();
    const tries = this._readActions(collName);
    for(const q of tries){
      const url = `${CONFIG.GAS_URL_SHEETS}?${new URLSearchParams(q)}`;
      try{
        const res = await fetch(url);
        const jr  = await res.json();

        if(jr && jr.success && Array.isArray(jr.data) && jr.data.length){
          const wasMatrix = Array.isArray(jr.data[0]);
          const rows = this._toObjects(jr.data);
          if(this._loadFailed) this._loadFailed[collName] = false;
          const sheet = this.SHEET_OF[q.action] || collName;
          console.log(`✅ [${collName}] ${rows.length}건 로드 — action='${q.action}' → 구글시트 탭 '${sheet}'`
                    + (wasMatrix ? ' (2차원 배열 → 객체 변환됨)' : ''));
          if(rows.length) console.log(`   필드:`, Object.keys(rows[0]).join(', '));
          return rows;
        }
        if(jr && jr.success && Array.isArray(jr.data)){
          console.warn(`⚠️ [${collName}] action='${q.action}' 은 성공했으나 데이터가 0건입니다 (시트가 비었거나 시트 이름이 다름)`);
          continue;
        }
        console.warn(`… [${collName}] action='${q.action}' 실패:`, (jr && jr.message) || jr);
      }catch(e){
        console.warn(`… [${collName}] action='${q.action}' 요청 오류:`, e.message);
      }
    }

    if(!tries.length){
      // 서버에 없는 것이 정상인 컬렉션 — 조용히 로컬만 사용
    } else {
      // 서버에서 못 받았다는 사실을 기록해 둔다 (화면 안내를 구분하기 위해)
      this._loadFailed = this._loadFailed || {};
      this._loadFailed[collName] = true;
      console.info(`ℹ️ [${collName}] 서버에서 못 받음 → localStorage 캐시 사용`);
    }
    try{
      const v = localStorage.getItem('orchard.'+collName);
      const arr = v ? JSON.parse(v) : [];
      if(tries.length) console.log(`   localStorage 캐시: ${arr.length}건`);
      return arr;
    }catch(e){ return []; }
  },
  async add(collName, obj){
    const id = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    const dataToSave = { id, ...obj };
    try{
      await fetch(CONFIG.GAS_URL_SHEETS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ action: 'create', sheetName: collName, ...dataToSave })
      });
    }catch(e){ console.warn('Google Sheets add 오류:', e); }
    try{
      let arr = [];
      try{ arr = JSON.parse(localStorage.getItem('orchard.'+collName)||'[]'); }catch(e){}
      arr.push(dataToSave);
      localStorage.setItem('orchard.'+collName, JSON.stringify(arr));
    }catch(e){}
    return id;
  },
  async update(collName, id, patch){
    try{
      await fetch(CONFIG.GAS_URL_SHEETS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ action: 'update', sheetName: collName, id, ...patch })
      });
    }catch(e){ console.warn('Google Sheets update 오류:', e); }
    try{
      let arr = JSON.parse(localStorage.getItem('orchard.'+collName)||'[]');
      let idx = arr.findIndex(x => x.id === id);
      if(idx >= 0){ arr[idx] = { ...arr[idx], ...patch }; localStorage.setItem('orchard.'+collName, JSON.stringify(arr)); }
    }catch(e){}
  },
  async remove(collName, id){
    try{
      await fetch(CONFIG.GAS_URL_SHEETS, {
        method: 'POST',

const Owned = {
  _set:new Set(),      // 상표명만 모은 집합 (예전 방식 호환용)
  _list:[],            // 보유 농약 원본 (4개 항목 대조용)
  norm(s){ return String(s||'').replace(/[\s()·\-]/g,'').toLowerCase(); },

  // 용도 표기 차이를 흡수한다: '살균' / '살균제' / '살균(수)' → 살균
  normUse(s){
    const v = this.norm(s);
    if(!v) return '';
    if(v.indexOf('살균')>=0 && v.indexOf('살충')>=0) return '균충';
    if(v.indexOf('살충')>=0 && v.indexOf('제초')>=0) return '충초';
    if(v.indexOf('살균')>=0) return '살균';
    if(v.indexOf('살충')>=0) return '살충';
    if(v.indexOf('제초')>=0) return '제초';
    if(v.indexOf('생장')>=0 || v.indexOf('생조')>=0) return '생조';
    return v;
  },

  // ── 용도 적합성 ──────────────────────────────────────
  // 병(sick) 탭에 제초제가 뜨면 작물을 죽일 수 있다. 탭에 맞는 용도만 남긴다.
  //   병   → 살균 · 균충 · 생조 · 기타
  //   해충 → 살충 · 균충 · 생조 · 기타
  //   제초 · 충초(살충제초) 는 어느 쪽에도 넣지 않는다.
  USE_FOR: {
    sick:   ['살균', '균충', '생조', '기타'],
    insect: ['살충', '균충', '생조', '기타']
  },

  // 용도가 실제로 갖는 '작용'을 펼친다.
  //   균충(살균살충) 은 살균 작용을 포함하므로 살균과 호환된다.
  //   충초(살충제초) 는 살충 작용을 포함하므로 살충과 호환된다.
  USE_ACTS: {
    '살균':['살균'], '살충':['살충'], '제초':['제초'],
    '균충':['살균','살충'], '충초':['살충','제초'],
    '생조':['생조'], '기타':['*']
  },
  useActs(use){
    const u = this.normUse(use);
    if(!u) return [];
    return this.USE_ACTS[u] || [u];
  },

  // 두 용도가 같은 약으로 볼 만한가 (작용이 하나라도 겹치면 호환)
  useCompatible(a, b){
    const A = this.useActs(a), B = this.useActs(b);
    if(!A.length || !B.length) return null;              // 판단 불가
    if(A.indexOf('*')>=0 || B.indexOf('*')>=0) return true;   // '기타'는 어디에나
    return A.some(x => B.indexOf(x) >= 0);
  },

  // 이 약이 지금 보고 있는 탭(병/해충)에 써도 되는가
  useFits(tabType, use){
    const allow = this.USE_FOR[tabType];
    if(!allow) return true;                 // 탭 정보가 없으면 거르지 않는다
    const u = this.normUse(use);
    if(!u) return true;                     // 용도가 비어 있으면 판단 보류 → 보여준다
    return allow.indexOf(u) >= 0;
  },

  // 두 값이 같은가. 한쪽이라도 비어 있으면 '확인 불가'(null)로 돌려준다.
  _cmp(a, b){
    const x = this.norm(a), y = this.norm(b);
    if(!x || !y) return null;                       // 비교할 수 없음
    return (x === y) || x.indexOf(y)>=0 || y.indexOf(x)>=0;
  },

  // 상표명·회사·용도·품목명을 대조해 4단계로 판정한다.
  //   'own'     보유     — 4개 항목 모두 일치
  //   'alt'     대체제   — 용도와 품목명이 같음 (회사·상표명만 다름) → 같은 약효
  //   'similar' 확인필요 — 상표명은 같은데 용도나 품목명이 어긋남 → 다른 약일 수 있음
  //   'none'    구입필요 — 보유 목록에 없음
  //
  // ⚠️ '대체제'가 '확인필요'보다 위인 이유:
  //    농약은 품목명(유효성분)과 용도가 같으면 회사가 달라도 약효가 같다.
  //    반대로 상표명이 같아도 품목명이 다르면 전혀 다른 약이다.
  match(row){
    const brand = row.pestiBrandName || row['상표명'] || row.brand || '';
    const rComp = row.compName     || row['회사명'] || '';
    const rUse  = row.useName      || row['용도']   || '';
    const rKomp = row.pestiKorName || row['품목명'] || '';

    // 용도는 '완전히 같은 글자'가 아니라 '작용이 겹치는가'로 본다.
    // (농약장 '균충' ↔ PSIS '살균' 은 같은 제품이다)
    const cmpUse = (a,b)=> this.useCompatible(a,b);

    let bestOwn=null, bestAlt=null, bestSim=null;

    for(const p of this._list){
      const pName = p.brandName || p.pestiBrandName || p.name;
      const pComp = p.manufacturer || p.compName;
      const pUse  = p.type || p.useName;
      const pKomp = p.ingredient || p.pestiKorName || p.komp;

      const c = {
        상표명: this._cmp(pName, brand),
        회사:   this._cmp(pComp, rComp),
        용도:   cmpUse(pUse, rUse),
        품목명: this._cmp(pKomp, rKomp)
      };
      const same = Object.keys(c).filter(k=>c[k]===true);
      const diff = Object.keys(c).filter(k=>c[k]===false);
      const unk  = Object.keys(c).filter(k=>c[k]===null);
      // 어긋난 항목은 '무엇과 무엇이' 다른지 실제 값을 남긴다
      const vals = { 상표명:[pName,brand], 회사:[pComp,rComp], 용도:[pUse,rUse], 품목명:[pKomp,rKomp] };
      const detail = diff.map(k => ({ 항목:k, 내것:String(vals[k][0]||'(빈칸)'), 등록:String(vals[k][1]||'(빈칸)') }));
      const info = { same, mismatch:diff, unknown:unk, detail, item:p };

      // ① 어긋난 것이 하나도 없고 상표명이 맞으면 → 보유
      if(c.상표명 === true && !diff.length){ return Object.assign({state:'own'}, info); }

      // ② 용도·품목명이 같으면 → 대체제 (상표명·회사는 달라도 무방)
      if(c.용도 === true && c.품목명 === true && !diff.filter(k=>k==='용도'||k==='품목명').length){
        if(!bestAlt) bestAlt = Object.assign({state:'alt'}, info);
        continue;
      }

      // ③ 상표명만 같고 용도나 품목명이 어긋남 → 확인필요
      if(c.상표명 === true && diff.length){
        if(!bestSim) bestSim = Object.assign({state:'similar'}, info);
      }
    }
    return bestOwn || bestAlt || bestSim || { state:'none' };
  },

  has(brand){ return this._set.has(this.norm(brand)); },
  async load(){
    const ps = await DB.rawPesticides();
    // 수량이 0 이하일 때만 제외한다.
    // 시트 셀이 비어 있으면 '' 또는 null 로 오는데, 이런 공란은 '보유'로 본다.
    const inStock = p => {
      const q = p.quantity;
      if(q === null || q === undefined) return true;          // 값 자체가 없음
      const s = String(q).trim();
      if(s === '' || s === '-') return true;                  // 공란 / 하이픈
      const n = parseFloat(s.replace(/[^0-9.\-]/g, ''));      // '3개', '1.5L' 등 대응
      if(!isFinite(n)) return true;                           // 숫자로 못 읽으면 보유로
      return n > 0;
    };

    const list = (ps||[]).filter(inStock);
    this._list = list;
    this._set = new Set(list.map(p=>this.norm(p.brandName||p.pestiBrandName||p.name)));
    console.log(`💊 보유 농약 ${this._set.size}종 (전체 ${(ps||[]).length}건 중 수량 0 제외 ${(ps||[]).length - list.length}건)`);
  }
};

const NCPMS = {
  async call(params){
    const qs = new URLSearchParams({ target:'ncpms', ...params }).toString();
    const url = CONFIG.GAS_URL + '?' + qs;
    const res = await fetch(url);
    const jr  = await res.json();
    if(!jr.ok) throw new Error(jr.error || 'NCPMS 오류');
    return jr.data;
  },
  listSick(cropName){ return this.call({ serviceCode:'SVC01', cropName, displayCount:CONFIG.displayCount, startPoint:1 }); },
  listInsect(cropName){ return this.call({ serviceCode:'SVC03', cropName, displayCount:CONFIG.displayCount, startPoint:1 }); },
  detailSick(sickKey){ return this.call({ serviceCode:'SVC05', sickKey }); },
  detailInsect(insectKey){ return this.call({ serviceCode:'SVC07', insectKey }); },
  rows(data){
    let best=[]; (function dig(n){
      if(Array.isArray(n)){ if(n.length>best.length && typeof n[0]==='object') best=n; n.forEach(dig); return; }
      if(n && typeof n==='object') Object.values(n).forEach(dig);
    })(data);
    if(best.length===0){
      const one = this.pick(data, ['sickNameKor','insectKorName','cropName']);
      if(one) best=[data.service||data];
    }
    return best;
  },
  pick(obj, keys){
    if(!obj||typeof obj!=='object') return '';
    for(const k of keys){ if(obj[k]!=null && obj[k]!=='' ) return String(obj[k]); }
    const lk = keys.map(k=>k.toLowerCase());
    for(const [k,v] of Object.entries(obj)){
      if(v && typeof v==='string' && lk.some(x=>k.toLowerCase().includes(x))) return v;
    }
    return '';
  },
  name(row){ return this.pick(row, ['sickNameKor','insectKorName','koreanName','name']); },
  nameEn(row){ return this.pick(row, ['sickNameEng','insectEngName','scientificName']); },
  key(row, type){ return this.pick(row, type==='sick' ? ['sickKey','oesTinFern','value'] : ['insectKey','bugKey','value']); },
  images(node){
    const out=new Set();
    (function dig(n){
      if(!n) return;
      if(typeof n==='string'){
        if(/thumbnailViewer2\.mo|\/photo\/|\.(jpe?g|png|gif)(\?|$)/i.test(n) && /^https?:\/\//.test(n)) out.add(n);
        return;
      }
      if(Array.isArray(n)){ n.forEach(dig); return; }
      if(typeof n==='object') Object.values(n).forEach(dig);
    })(node);
    return [...out];
  },
  proxyUrl(u){ return CONFIG.GAS_URL + '?target=ncpmsimg&url=' + encodeURIComponent(u); },
};

      '냉이','달래','쑥','머위','방풍','당귀','신선초','명이','부지깽이',
      // 허브
      '바질','루꼴라','고수','민트','로즈마리','타임','오레가노','딜','차이브'
    ];
    if(vegHints.some(k => nm.includes(k))) return { category: '채소', sure: true };

    // 어느 쪽 단서도 없으면 채소로 두되 '불확실' 표시
    return { category: '채소', sure: false };
  },

  isFruit(name, category){
    const cat=(category||'').toLowerCase(), nm=(name||'').toLowerCase();
    if(cat.includes('유실수')||cat.includes('과수')) return true;
    if(cat.includes('채소')||cat.includes('작물')) return false; 
    const exactFruits = ['감', '배', '밤'];
    if(exactFruits.some(k => nm === k || (nm.endsWith(k) && !nm.includes('감자') && !nm.includes('양배추')))) return true;
    return CONFIG.fruitKeywords.some(k => !exactFruits.includes(k) && nm.includes(String(k).toLowerCase()));
  },

  _stdOverrides: {},
  async loadStdOverrides(){
    try{
      const rows = await DB.list('cropNameOverrides');
      this._stdOverrides = {};
      (rows||[]).forEach(r => { if(r.name && r.stdName) this._stdOverrides[r.name] = { stdName:r.stdName, id:r.id }; });
    }catch(e){ this._stdOverrides = {}; }
  },
  async setStdOverride(name, stdName){
    const cur = this._stdOverrides[name];
    if(cur && cur.id){
      await DB.update('cropNameOverrides', cur.id, { stdName });
      this._stdOverrides[name].stdName = stdName;
    }else{
      const id = await DB.add('cropNameOverrides', { name, stdName, createdAt:Date.now() });
      this._stdOverrides[name] = { stdName, id };
    }
  },

  getStandardName(name) {
    if(!name) return '';
    if(this._stdOverrides && this._stdOverrides[name]) return this._stdOverrides[name].stdName;
    const customMap = { '선비잡이콩': '콩', '머루콩': '콩', '아주까리콩': '콩', '작두콩': '콩', '동부콩': '콩', '하나가리': '콩', '단감': '감', '참다래': '참다래(키위)', '키위': '참다래(키위)', '방울토마토': '토마토' };
    if(customMap[name]) return customMap[name];
    let best = null, bestEnd = -1, bestLen = 0;
    for(const std of this.STD_CROPS){
      const idx = name.lastIndexOf(std);
      if(idx < 0) continue;
      const end = idx + std.length;
      if(end > bestEnd || (end === bestEnd && std.length > bestLen)){ best = std; bestEnd = end; bestLen = std.length; }
    }
    return best || name;
  },

  async loadCrops(){
    const raw = await DB.rawPlants();
    const seen=new Set(), out=[];
    let skipStatus=0, skipNoName=0, skipDup=0;
    for(const p of (raw||[])){
      const st = this.normStatus(p.status || p['상태'] || '');
      if(st === 'deleted' || st === 'dead' || st === 'done'){ skipStatus++; continue; }
      // 시트 헤더가 한글일 수 있으므로 후보를 넓게 잡는다
      const originalName = p.name || p.cropName || p['작물명'] || p['이름'] || p['작물'] || '';
      if(!originalName){ skipNoName++; continue; }
      if(seen.has(originalName)){ skipDup++; continue; } seen.add(originalName);
      const stdName = this.getStandardName(originalName);
      out.push({
        id: p.id||originalName, name: originalName,
        // 실제 작물명이 앞, 검색용 표준명은 괄호 안.
        // (예전엔 '아주까리(아주까리콩)' 처럼 표준명이 앞에 와서 다른 작물로 착각하기 쉬웠다)
        displayName: stdName !== originalName ? `${originalName} (${stdName})` : originalName,
        // category 가 비었거나 이상하면 cat 열을, 그것도 아니면 작물명으로 판정
        category: this.normCategory(p.category || p.cat, originalName),
        rawCategory: String(p.category == null ? '' : p.category).trim(),   // 시트에 실제로 적힌 값
        catSure:    this.classify(originalName, p.category || p.cat).sure,  // 판정을 믿어도 되는가
        status: st,
        ncpmsName: stdName, psisName: CONFIG.cropMapToPsis[stdName] || stdName,
        location: p.location || p.spot || '' 
      });
    }
    const needFix = out.filter(c => c.rawCategory !== '유실수' && c.rawCategory !== '채소');
    const unsure  = needFix.filter(c => !c.catSure);
    console.log(`🌱 작물 정리 결과: 원본 ${(raw||[]).length}건 → 표시 ${out.length}건`
              + ` (상태제외 ${skipStatus}, 이름없음 ${skipNoName}, 중복 ${skipDup})`);
    if(needFix.length){
      console.warn(`🟠 시트 분류값이 유실수/채소가 아닌 작물 ${needFix.length}종 — 목록에 • 로 표시됩니다`);
      console.table(needFix.map(c => ({ 작물:c.name, '시트값':c.rawCategory || '(빈칸)',
                                        '자동판정':c.category, '확신':c.catSure ? '높음' : '낮음 ?' })));
    }
    if(unsure.length){
      console.warn(`❓ 이름만으로 분류를 확신할 수 없는 작물 ${unsure.length}종 — 목록에 빨간 ? 로 표시됩니다. `
                 + `✏️ 로 직접 지정해 주세요: ${unsure.map(c=>c.name).join(', ')}`);
    }
    if((raw||[]).length && !out.length && (raw||[])[0]){
      console.warn('⚠️ 데이터는 있으나 작물명을 못 찾았습니다. 첫 행 내용:', (raw||[])[0]);
    }
    return out.sort((a,b)=> (a.category===b.category ? a.displayName.localeCompare(b.displayName,'ko') : (a.category==='유실수'?-1:1)));
  },

  // 아래 진단 영역의 안내 문구를 현재 상황에 맞게 바꾼다
  setListPlaceholder(state){
    const el = document.getElementById('listPlaceholder');
    if(!el) return;                       // 이미 진단 결과가 그려졌으면 없음
    if(state === 'failed'){
      el.innerHTML = '<span style="color:#C62828">작물 목록을 불러오지 못했습니다 — 새로고침해 주세요.</span>';
    } else if(state === 'empty'){
      el.innerHTML = '아래 <b>＋ 작물 추가</b>로 재배 중인 작물을 등록해 주세요.';
    } else {
      el.innerHTML = `위에서 진단할 작물을 선택하세요. `
        + `<span style="opacity:0.7">(${this._crops.length}종 등록됨)</span>`;
    }
  },

  renderCrops(){
    const box=document.getElementById('crops');
    const mw=document.getElementById('cropManualWrap');
    if(mw) mw.style.display = this._external ? 'none' : 'block';
    if(!this._crops.length){
      const failed = DB._loadFailed && DB._loadFailed[CONFIG.plantsCollection];
      if(failed){
        // 서버에서 못 받은 것 — '등록된 작물이 없다'와 구분해야 한다
        box.innerHTML = `<div class="state" style="padding:16px;color:#C62828">`
          + `⚠️ 작물 목록을 불러오지 못했습니다.<br>`
          + `<span style="font-size:12px;opacity:0.85">인터넷 연결을 확인한 뒤 새로고침해 주세요.</span></div>`;
        this.setListPlaceholder('failed');
      } else {
        box.innerHTML = `<div class="state" style="padding:16px">아래에 <b>작물을 추가</b>해 진단을 시작하세요.</div>`;
        this.setListPlaceholder('empty');
      }
      return;
    }
    this.setListPlaceholder('ready');
    const cat=(icon,key,label)=>{
      const rows=this._crops.filter(x=>(x.category||'기타')===key);
      if(!rows.length) return '';
      return `<div class="cropcat">${icon} ${label} <span class="cnt">(${rows.length}종)</span></div><div class="crops-row">`
        + rows.map(x=>{
          // 시트의 category 가 유실수/채소가 아니면(예: 재배중) 눈에 띄게 표시
          const raw = x.rawCategory || '';
          const isValid = (raw === '유실수' || raw === '채소');
          let mark = '';
          if(!isValid && !x.catSure){
            // 시트값도 없고 이름으로도 판단이 안 됨 → 확인 필요
            mark = `<span title="분류를 확신할 수 없습니다 — ✏️ 로 직접 지정해 주세요" style="color:#C62828;font-weight:900">?</span> `;
          } else if(!isValid){
            mark = `<span title="시트 분류값이 '${raw || '빈칸'}' 입니다 — 유실수/채소로 정리하세요" style="color:#E65100;font-weight:900">•</span> `;
          }
          return `<span class="crop-wrap">
      		<button class="crop ${this.cropObj&&this.cropObj.id===x.id?'on':''}" onclick="App.selectCrop('${x.id}')">${mark}${x.displayName}</button>
      		<button class="crop-pen" title="작물 편집" onclick="event.stopPropagation();App.quickEdit('${x.id}')">✏️</button>
	</span>`;
        }).join('') + `</div>`;
    };
    box.innerHTML = cat('🌳','유실수','유실수') + cat('🥬','채소','채소·작물') + cat('🌱','기타','기타');
  },

  async selectCrop(id){ const c=this._crops.find(x=>x.id===id); if(c) this.setActive(c); },
  async quickEdit(id){
    const c = this._crops.find(x=>x.id===id); if(!c) return;
    const cat = c.category || '';
    const isFruit = cat.includes('유실수') || cat.includes('과수');
    const ans = prompt(`[${c.displayName}] 편집\n1 = ${isFruit?'채소로':'유실수로'} 전환\n2 = 표준 작물명 수정\n번호 입력:`, '1');
    if(ans==='1'){ await CropManager.open(); await CropManager.toggleCategory(id); }
    else if(ans==='2'){ await CropManager.editStdName(c.name); }
  },

  selectByName(name, psis){
    if(!name) return;
    let c=this._crops.find(x=>x.name===name);
    if(!c){
      const stdName = this.getStandardName(name);
      c={ id:name, name, displayName: stdName!==name ? `${name} (${stdName})` : name,
          category:this.isFruit(stdName,'')?'유실수':'채소',
          ncpmsName:stdName, psisName: psis || CONFIG.cropMapToPsis[stdName] || stdName, location:'' };
    }
    this.setActive(c);
  },
  
  setActive(c){
    this.cropObj=c; this.crop=c.ncpmsName||c.name; this.cropPsis=c.psisName||c.name;
    this.cache={};
    const pick=document.getElementById('cropPick'); if(pick) pick.style.display='none';
    const ec=document.getElementById('embedCrop');
    ec.style.display='flex';
    const changer = document.body.classList.contains('embed')
      ? `<span class="chg">관리앱에서 변경</span>`
      : `<button class="chg-btn" onclick="App.changeCrop()">↺ 작물 변경</button>`;
    ec.innerHTML=`<span class="tag">${c.category||''}</span> ${c.displayName || c.name} ${changer}`;
    document.getElementById('tabs').style.display='flex';
    this.switchTab(this.type, true);
  },
  
  changeCrop(){
    this.cropObj=null; this.crop=null; this.cropPsis=null; this.cache={};
    document.getElementById('embedCrop').style.display='none';
    document.getElementById('tabs').style.display='none';
    document.getElementById('list').innerHTML='<div class="state">작물을 선택하세요.</div>';
    const pick=document.getElementById('cropPick'); if(pick) pick.style.display='';
    this.renderCrops();
  },

  switchTab(type, force){
    if(type===this.type && !force){} this.type=type;
    document.querySelectorAll('.tab').forEach(t=>
      t.classList.toggle('on', (t.dataset.type==='sick'?'sick':'insect')===type));
    this.loadList();
  },

  async loadList(){
    const key=this.crop+'|'+this.type;
    const box=document.getElementById('list');
    box.innerHTML=`<div class="state"><div class="spinner"></div>${this.crop} · ${this.type==='sick'?'병':'해충'} 불러오는 중…</div>`;
    try{
      let data = this.cache[key] || (this.cache[key] = await (this.type==='sick' ? NCPMS.listSick(this.crop) : NCPMS.listInsect(this.crop)));
      const rows=NCPMS.rows(data);
      if(!rows.length){ box.innerHTML = this.debugView(data); return; }
      box.innerHTML = `<div class="grid">`+ rows.map((r,i)=>{
        const nm=NCPMS.name(r)||'(이름미상)', en=NCPMS.nameEn(r);
        const imgs=NCPMS.images(r); const th=imgs[0];
        return `<div class="card" onclick="App.openDetail(${i})">
          <div class="thumb">${ th ? `<img loading="lazy" src="${th}" onerror="App.imgFallback(this,'${encodeURIComponent(th)}')">` : `<div class="ph">사진 준비중</div>`}</div>
          <div class="body"><div class="nm">${nm}</div>${en?`<div class="en">${en}</div>`:''}</div>
        </div>`;
      }).join('') +`</div>`;
      this._rows=rows;
    }catch(e){
      box.innerHTML=`<div class="state">불러오지 못했습니다.<br><small>${e.message}</small></div>`;
    }
  },

  debugView(data){
    return `<div class="hint" style="background:#F7E2DE;border-color:#e6b3a8;color:#7a2f22"><b>‘${this.crop}’ 항목을 찾지 못했습니다.</b></div>`;
  },

  async webImages(query, btn){
    const strip=document.getElementById('webstrip');
    if(btn){ btn.disabled=true; btn.textContent='검색 중…'; }
    strip.innerHTML=`<div class="empty"><span class="spinner" style="width:18px;height:18px;display:inline-block;vertical-align:middle"></span> 웹 이미지 검색 중…</div>`;
    try{
      const qs=new URLSearchParams({ target:'imgsearch', q:query, display:'12' }).toString();
      const r=await fetch(CONFIG.GAS_URL+'?'+qs); const jr=await r.json();
      if(!jr.ok) throw new Error(jr.error||'검색 실패');
      const items=jr.items||[];
      if(!items.length){ strip.innerHTML=`<div class="empty">검색 결과가 없습니다.</div>`; }
      else{
        strip.innerHTML = items.map(it=>
          `<img loading="lazy" src="${it.thumb}" title="${(it.title||'').replace(/"/g,'')} — 클릭하면 크게"
             onclick="App.zoom('${it.thumb}')" onerror="this.remove()">`).join('')
          + `<div class="src">이미지 출처: 웹 검색(네이버) · 참고용이며 저작권은 각 출처에 있습니다.</div>`;
      }
      if(btn){ btn.textContent='🔄 다시 검색'; btn.disabled=false; }
    }catch(e){
      strip.innerHTML=`<div class="empty" style="color:#C24A3A">${e.message}</div>`;
      if(btn){ btn.textContent='🔍 웹 이미지 검색'; btn.disabled=false; }
    }
  },

  imgFallback(img, encUrl){
    if(img.dataset.tried) { img.parentNode.innerHTML='<div class="ph">사진 없음</div>'; return; }
    img.dataset.tried='1';
    fetch(NCPMS.proxyUrl(decodeURIComponent(encUrl)))
      .then(r=>r.json())
      .then(d=>{ if(d.ok) img.src=d.dataUri; else img.parentNode.innerHTML='<div class="ph">사진 없음</div>'; })
      .catch(err=>{ console.info('ℹ️ 병해충 사진 로드 실패:', err.message);
                    if(img.parentNode) img.parentNode.innerHTML='<div class="ph">사진 없음</div>'; });
  },

      <div class="compare">
        <div class="col">
          <h3>📷 <b>내 사진</b></h3>
          <label class="myphoto" id="myphoto">
            <span>탭하여 촬영<br>또는 선택</span>

          </label>
        </div>
        <div class="col">
          <h3>🔍 <b>참조</b></h3>
          <div class="refmain">${ imgs.length ? `<img loading="lazy" src="${imgs[0]}" onclick="App.zoom(this.src)">` : `<div class="ph2">참조사진 없음</div>` }</div>
        </div>
      </div>

      <div class="info webbox">
        <h4>웹에서 증상 사진 더 찾기 <span class="unoff">비공식 · 참고용</span></h4>
        <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px">
          NCPMS 사진이 없거나 부족할 때만 참고하세요. 웹 이미지는 출처가 검증되지 않아
          <b>실제 병해충과 다를 수 있습니다.</b></p>
        <button class="webbtn" onclick="App.webImages('${(this.crop+' '+(nm||'')).replace(/'/g,'')}', this)">
          🔍 ‘${this.crop} ${nm}’ 웹 이미지 검색</button>
        <div class="webstrip" id="webstrip"></div>
      </div>

      ${symptoms?`<div class="info"><h4>증상</h4><p>${symptoms}</p></div>`:''}
      ${environ?`<div class="info"><h4>발생 환경</h4><p>${environ}</p></div>`:''}
      ${prevent?`<div class="info"><h4>방제 요령</h4><p>${prevent}</p></div>`:''}
      <div class="handoff">
        <button class="btn-rx" onclick="App.prescribe('${(nm||'').replace(/'/g,'')}','${this.type}')">
          💊 이 ${isPest?'해충':'병'}으로 <b style="margin:0 4px">등록 농약</b> 찾기
        </button>
      </div>`;
  },
  setMyPhoto(input){
    const f=input.files[0]; if(!f) return;
    document.getElementById('myphoto').innerHTML=`<img src="${URL.createObjectURL(f)}">`;
  },
  zoom(src){ document.getElementById('lbImg').src=src; document.getElementById('lb').classList.add('on'); },
  closeSheet(){ document.getElementById('sheetBg').classList.remove('on'); document.body.style.overflow=''; },
  prescribe(name, type){ AppBus.emit('prescription:request', { cropName:this.crop, cropPsis:this.cropPsis, cropId:this.cropObj&&this.cropObj.id, name, type }); },
  async openFromName({cropId, cropName, name}){
    if(!this.cropObj || (cropId? this.cropObj.id!==cropId : this.crop!==cropName)){
      const c = cropId ? this._crops.find(x=>x.id===cropId) : this._crops.find(x=>x.name===cropName);
      if(c) await this.selectCrop(c.id);
    }
    let idx = (this._rows||[]).findIndex(r=>NCPMS.name(r)===name);
    if(idx>=0) this.openDetail(idx);
  }
};

const Rx = {
  init(){ AppBus.on('prescription:request', d=>this.search(d)); },
  psisCrop(c){ return CONFIG.cropMapToPsis[c] || c; },

  async search({cropName, cropPsis, cropId, name, type}){
    this._hctx = { cropName, cropPsis:cropPsis||cropName, cropId, name, type };
    const bg=document.getElementById('rxBg'), box=document.getElementById('rx');
    bg.classList.add('on'); document.body.style.overflow='hidden';
    box.innerHTML=`<div class="rx-hd"><h2>💊 등록 농약</h2><button class="x" onclick="Rx.close()">✕</button></div><div class="state"><div class="spinner"></div>PSIS 조회 중…</div>`;
    try{
      const qs=new URLSearchParams({ crops: cropPsis || this.psisCrop(cropName), diseases: name }).toString();
      const r=await fetch(CONFIG.GAS_URL+'?'+qs);
      const jr=await r.json();
      let list = Array.isArray(jr) ? jr : (jr.items || jr.data || jr.list || jr.rows || NCPMS.rows(jr));
      this.render(cropName, name, Array.isArray(list)?list:[]);
    }catch(e){ box.innerHTML=`<div class="state">조회 실패<br><small>${e.message}</small></div>`; }
  },
  render(cropName, name, rows){
    const box=document.getElementById('rx');

    // 탭(병/해충)에 맞지 않는 용도를 먼저 제외한다 — 제초제가 섞이면 위험하다
    const tabType = (this._hctx && this._hctx.type) || '';
    const before  = rows.length;
    const dropped = rows.filter(r => !Owned.useFits(tabType, NCPMS.pick(r,['useName','용도'])));
    rows = rows.filter(r => Owned.useFits(tabType, NCPMS.pick(r,['useName','용도'])));
    if(dropped.length){
      const kinds = [...new Set(dropped.map(r => NCPMS.pick(r,['useName','용도'])||'?'))];
      console.info(`🚫 ${tabType==='sick'?'병':'해충'} 방제에 맞지 않는 용도 ${dropped.length}건 제외: ${kinds.join(', ')}`);
    }

    // 보유 농약을 맨 앞으로 (같은 그룹 안에서는 원래 순서 유지 = 안정 정렬)
    // 상표명·회사·용도·품목명을 모두 대조해 판정한다
    const rank = { own:0, alt:1, similar:2, none:3 };
    const matchOf = r => Owned.match(r);
    rows = rows
      .map((r,idx)=>({ r, idx, m: matchOf(r) }))
      .sort((a,b)=> (rank[a.m.state] !== rank[b.m.state])
                     ? rank[a.m.state] - rank[b.m.state] : a.idx - b.idx)
      .map(x=>x.r);

    const ownCount = rows.filter(r => matchOf(r).state === 'own').length;
    const altCount = rows.filter(r => matchOf(r).state === 'alt').length;
    const simCount = rows.filter(r => matchOf(r).state === 'similar').length;

    // ⚠️ Plan.open(i) 이 _items 의 인덱스를 쓰므로 정렬한 배열을 그대로 저장해야 한다
    this._items = rows;

    const cardHtml=(r,i)=>{
      const brand = NCPMS.pick(r,['pestiBrandName','상표명'])||'';
      const komp = NCPMS.pick(r,['pestiKorName','품목명']);
      const comp = NCPMS.pick(r,['compName','회사명']);
      const use  = NCPMS.pick(r,['useName','용도'])||'';
      const m   = Owned.match(r);
      const st  = m.state;
      const badge = st==='own' ? `<span class="own-badge">보유</span>`
                  : st==='alt' ? `<span class="alt-badge" title="용도와 품목명이 같아 같은 약효입니다">🔄 대체제</span>`
                  : st==='similar' ? `<span class="sim-badge" title="상표명은 같지만 ${(m.mismatch||[]).join('·')}이(가) 다릅니다">⚠ 확인필요</span>`
                  : `<span class="buy-badge">구입필요</span>`;

      // 같은 점 / 다른 점을 나눠 보여준다
      const mine = (m.item && (m.item.name || m.item.brandName)) || '';
      let note = '';
      if(st !== 'none' && m.item){
        const same = (m.same||[]).filter(k=>k!=='상표명');
        note = `<div class="cmp-note ${st}">`
          + `<b>보유:</b> ${mine}`
          + (same.length     ? ` <span class="cmp-same">✓ ${same.join('·')} 같음</span>` : '')
          + ((m.detail||[]).length
              ? ` <span class="cmp-diff">✕ ` + m.detail.map(d =>
                  `${d.항목} 다름(내것 <b>${d.내것}</b> / 등록 <b>${d.등록}</b>)`).join(', ') + `</span>`
              : ((m.mismatch||[]).length ? ` <span class="cmp-diff">✕ ${m.mismatch.join('·')} 다름</span>` : ''))
          + ((m.unknown||[]).length  ? ` <span class="cmp-unk">? ${m.unknown.join('·')} 정보없음</span>` : '')
          + `</div>`;
      }
      return `<div class="pesti ${st==='own'?'owned':''} ${st==='alt'?'alt':''} ${st==='similar'?'similar':''}">
        <div class="top"><span class="brand">${brand||'-'}</span>
          ${badge}
          ${use?`<span class="use">${use}</span>`:''}</div>
        <div class="meta">${komp?komp+' · ':''}${comp||''}</div>
        ${note}
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="back prim" onclick="Plan.open(${i})">📅 방제계획</button>
        </div>
      </div>`;
    };
    box.innerHTML=`<div class="rx-hd"><h2>💊 등록 농약</h2><button class="x" onclick="Rx.close()">✕</button></div>
      <p class="rx-sub"><b>${cropName}</b> · <b>${name}</b> 등록 약제 ${rows.length}건
        ${dropped.length ? `<span class="rx-drop-cnt">· ${tabType==='sick'?'병':'해충'} 방제용이 아닌 ${dropped.length}건 제외</span>` : ''}
        ${ownCount ? `<span class="rx-own-cnt">· 보유 ${ownCount}</span>` : ''}
        ${altCount ? `<span class="rx-alt-cnt">· 대체제 ${altCount}</span>` : ''}
        ${simCount ? `<span class="rx-sim-cnt">· 확인필요 ${simCount}</span>` : ''}</p>
      ${rows.length
        ? rows.map((r,i)=>{
            // 보유 목록이 끝나는 지점에 구분선을 한 번 넣는다
            let sep = '';
            if(altCount && i === ownCount)
              sep = '<div class="rx-divider">아래는 대체제 — 용도·품목명이 같아 같은 약효</div>';
            else if(simCount && i === ownCount + altCount)
              sep = '<div class="rx-divider">아래는 상표명만 같은 약제 — 확인 필요</div>';
            else if(i === ownCount + altCount + simCount && i < rows.length)
              sep = '<div class="rx-divider">아래는 보유하지 않은 약제</div>';
            return sep + cardHtml(r,i);
          }).join('')
        : '<div class="state">등록된 약제를 찾지 못했습니다.</div>'}`;
  },
  close(){ document.getElementById('rxBg').classList.remove('on'); document.body.style.overflow=''; }
};

const Plan = {
  open(i){
    const item = Rx._items[i]; if(!item) return;
    const h = Rx._hctx || {};
    const P=(k)=>NCPMS.pick(item,k);
    this.ctx = {
      cropId:h.cropId||null, cropName:h.cropName||App.crop, disease:h.name, type:h.type,
      brand:P(['pestiBrandName','상표명'])||P(['pestiKorName','품목명']),
      pestiCode:P(['pestiCode']), dilut:P(['dilutUnit']), suit:P(['useSuittime']),
      useName:P(['useName']), num:Math.min(5, parseInt((P(['useNum'])||'1').replace(/[^0-9]/g,''))||1), mode:null
    };
    this.renderChoice();
  },
  modal(html){ document.getElementById('planBox').innerHTML=html; document.getElementById('planBg').classList.add('on'); document.body.style.overflow='hidden'; },
  close(){ document.getElementById('planBg').classList.remove('on'); document.body.style.overflow=''; },
  _iso(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; },
  _addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); },

  renderChoice(){
    this.modal(`
      <div class="rx-hd"><h2>📅 방제 계획</h2><button class="x" onclick="Plan.close()">✕</button></div>
      <button class="choice" onclick="Plan.choose('예방')"><b>🛡 예방 살포</b><span>격주 주말마다 정기 살포.</span></button>
      <button class="choice" onclick="Plan.choose('방제')"><b>🎯 발생 후 방제</b><span>이미 증상 있음. 촘촘히 집중.</span></button>`);
  },
  choose(mode){ this.ctx.mode=mode; this.buildSchedule(); this.renderSchedule(); },
  buildSchedule(){
    const c=this.ctx; c.entries=[];
    c.num = Math.min(c.num || 1, 5);
    let d = new Date();
    for(let k=0;k<c.num;k++){ c.entries.push({date:this._iso(this._addDays(d, k*7)), done:false}); }
  },
  renderSchedule(){
    const c=this.ctx;
    const rows=c.entries.map((e,idx)=>`<label class="spray"><input type="checkbox" ${e.done?'checked':''} onchange="Plan.toggle(${idx})"><span><b>${idx+1}차</b> ${e.date}</span></label>`).join('');
    this.modal(`
      <div class="rx-hd"><h2>📅 ${c.mode} 스케줄</h2><button class="x" onclick="Plan.close()">✕</button></div>
      <div class="info"><h4>살포 계획 (${c.num}회)</h4>${rows}</div>
      <button class="btn-rx" onclick="Plan.save()">이 계획 저장</button>`);
  },
  toggle(idx){ this.ctx.entries[idx].done=!this.ctx.entries[idx].done; },

  async save(){
    const c=this.ctx;
    const dxId = await DB.add('diagnoses', { cropId:c.cropId, cropName:c.cropName, type:c.type, name:c.disease, status:'처방완료', diagnosedAt:Date.now() });
    const planId = await DB.add('sprayPlan', { diagnosisId:dxId, cropId:c.cropId, cropName:c.cropName, disease:c.disease, brandName:c.brand, entries:c.entries, createdAt:Date.now() });

    for (let i = 0; i < c.entries.length; i++) {
      const entry = c.entries[i];
      await DB.add('tasks', {
         title: `[${c.mode}] ${c.cropName} ${c.disease} 방제 ${i+1}차 (${c.brand})`,
         date: entry.date, done: false, category: '방제',
         cropName: c.cropName, brandName: c.brand, linkedPlanId: planId, entryIndex: i, createdAt: Date.now()
      });
    }
    this.close();
    Toast.show('방제 계획과 할일 목록에 성공적으로 저장했습니다.');
  },

  async review(){
    const plans = await DB.list('sprayPlan');
    const body = plans.length ? plans.slice().reverse().map(p=>{
      return `<div class="info"><h4>${p.cropName} · ${p.disease}</h4></div>`;
    }).join('') : `<div class="state">저장된 방제 계획이 없습니다.</div>`;
    this.modal(`<div class="rx-hd"><h2>📋 방제 계획 · 실행 체크</h2><button class="x" onclick="Plan.close()">✕</button></div>${body}`);
  }
};

const CropManager = {
  plants: [],
  async addCrop() {
    const el = document.getElementById('cropInput');
    const v = (el.value || '').trim();
    if(!v) return;
    const stdName = App.getStandardName(v);
    // 이름만으로 분류가 확실하지 않으면 사용자에게 직접 묻는다.
    // (키워드 목록에 없는 유실수가 조용히 채소로 등록되는 것을 막는다)
    const guess = App.classify(v, '');
    let cat0 = guess.category;
    if(!guess.sure){
      cat0 = confirm(`'${v}' 은(는) 유실수(과일나무) 인가요?\n\n확인 = 🌳 유실수\n취소 = 🥬 채소·작물`)
             ? '유실수' : '채소';
    }
    // 분류는 category 열 하나로 통일 (cat 열은 더 이상 기록하지 않음)
    // status 는 영문 코드로 통일 (과수원 앱과 동일)
    const newCrop = { name: v, category: cat0, status: 'active', createdAt: Date.now() };
    await DB.add(CONFIG.plantsCollection, newCrop);
    el.value = '';
    Toast.show(`'${v}' 작물이 새로 등록되었습니다.`);
    App._crops = await App.loadCrops();
    App.renderCrops();
    App.selectByName(v);
  },
  async open() {
    this.plants = await DB.rawPlants();
    this.render();
  },
  async setStatus(id, status) {
    // normStatus 는 App 의 메서드다. CropManager 안에서 this. 로 부르면 undefined.
    await DB.update(CONFIG.plantsCollection, id, { status: App.normStatus(status) });
    App._crops = await App.loadCrops();
    App.renderCrops();
  },
  async toggleCategory(id) {
    const p = this.plants.find(x => x.id === id); if(!p) return;
    const newCat = (p.category||'').includes('유실수') ? '채소' : '유실수';
    await DB.update(CONFIG.plantsCollection, id, { category: newCat });
    App._crops = await App.loadCrops();
    App.renderCrops();
    this.render();
  },
  render() {
    const box = document.getElementById('planBox');
    document.getElementById('planBg').classList.add('on');
    const rows = (this.plants||[]).map(p => `
       <div class="info" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; margin-bottom:8px;">
          <div><b>${p.name}</b> <span style="font-size:11px">${App.normCategory(p.category || p.cat, p.name)}</span></div>
          <select onchange="CropManager.setStatus('${p.id}', this.value)" style="padding:6px; border-radius:8px;">
            <option value="active" ${App.normStatus(p.status)==='active'?'selected':''}>🌱 재배 중</option>
            <option value="done"   ${App.normStatus(p.status)==='done'?'selected':''}>🧺 수확 완료</option>
            <option value="dead"   ${App.normStatus(p.status)==='dead'?'selected':''}>🥀 고사</option>
          </select>
       </div>`).join('');
    box.innerHTML = `<div class="rx-hd"><h2>🌱 작물 상태 관리</h2><button class="x" onclick="Plan.close()">✕</button></div>${rows || '<div class="state">등록된 작물이 없습니다.</div>'}`;
  }
};

const Toast = {
  show(msg){
    let t=document.getElementById('toast');
    if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
    t.textContent=msg; t.className='show';
    setTimeout(()=>{ t.className=''; },2800);
  }
};

App.init();
Rx.init();
</script>
