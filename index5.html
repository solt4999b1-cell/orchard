  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

    .app-container { max-width: 900px; margin: 0 auto; padding: 4px; padding-bottom: 40px; }
    .app-header { background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }

    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 10px; margin-top: 4px; padding: 6px 10px; background: rgba(255, 255, 255, 0.3); border-radius: 6px; width: fit-content; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.2); }
    .sync-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #90EE90; animation: pulse 1.5s ease-in-out infinite; }

    /* 통계 그리드 스타일 조정 (보유농약 칸과 분류별 요약 칸 배치) */
    .stat-grid { display: grid; grid-template-columns: 90px 1fr; gap: 6px; margin-top: 6px; }

    .stat-detail-box { background: rgba(255, 255, 255, 0.2); padding: 6px 10px; border-radius: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; }
    .stat-detail-item { background: rgba(0, 0, 0, 0.15); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }

    .btn { padding: 6px 12px; background: var(--green-dark); color: #fff; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .btn:hover { background: #1B5E20; }
    .results-section { margin-bottom: 4px; }
    .section-title { font-size: 12px; font-weight: 600; padding: 4px 0 4px 8px; color: var(--gray-600); border-left: 2px solid var(--green-dark); margin-bottom: 4px; }
    .pesticide-card { background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; }
    .pesticide-card:hover { background: var(--green-light); border-color: var(--green-dark); transform: translateY(-1px); }
    .pesticide-name:hover { color: var(--green-dark); text-decoration: underline; }
    .pesticide-info { flex: 1; }
    .pesticide-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .pesticide-meta { font-size: 11px; color: var(--gray-600); }
    .source-badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-top: 4px; font-weight: 600; background: #E8F5E9; color: #2E7D32; }
    .pesticide-actions { display: flex; gap: 6px; }
    .btn-small { padding: 6px 10px; font-size: 11px; background: var(--gray-200); color: var(--gray-700); border: none; border-radius: 4px; cursor: pointer; }
    .category-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 0; margin-bottom: 8px; }
    .category-tab { padding: 6px 10px; border: 1.5px solid #ddd; background: white; color: #666; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; white-space: nowrap; }

<script>
// ════════════════════════════════════════════════════════════════
// 설정 및 전역 변수
// ════════════════════════════════════════════════════════════════

// ⭐ Google Sheets API 설정 (CORS 완벽 지원 - 읽기용)
const SHEET_ID = '12cRWUcZah1z3DaZq5aJcojV8m3J5UU3m2F2ux6GwCec';
const SHEET_API_NAME = 'myPesticides';
const API_KEY = 'AIzaSyAKjQRRjXwmblrZPqv8DxNfo15E2B58kKA';  // ← API 키는 필요시 교체
const SHEETS_API_URL = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_API_NAME}!A:Z?key=${API_KEY}`;

// 쓰기/수정/삭제용 GAS URL
const GAS_URL_SHEETS = 'https://script.google.com/macros/s/AKfycbwXbgptSmUJ8vhr_crTAsnbMhoSPzronQdJNWfLN2z7xaJpb-k3Pr8Ts9aNjfqKDI4b/exec';
const CURRENT_SHEET_NAME = 'myPesticides';
const CONFIG_GAS_URL = 'https://script.google.com/macros/s/AKfycbwXbgptSmUJ8vhr_crTAsnbMhoSPzronQdJNWfLN2z7xaJpb-k3Pr8Ts9aNjfqKDI4b/exec';

let sheetsData = [];
let editingId = null;
let currentCategory = 'all';
let isViewMode = false;
let psisResultsCache = null;

function normalizeType(typeValue) {
  if (!typeValue) return '';
  const s = String(typeValue).replace(/\s/g, '').trim();

  const mapping = {
    '살균제': '살균', '살충제': '살충', '제초제': '제초',
    '균충제': '균충', '충초제': '충초', '생조제': '생조',
    '살균': '살균', '살충': '살충', '제초': '제초',
    '균충': '균충', '충초': '충초', '생조': '생조', '기타': '기타',
    // ⭐ 겸용제 정식 명칭 — 이게 없어서 '균충' 필터에 안 잡혔다
    '살균살충제': '균충', '살균살충': '균충',
    '살충제초제': '충초', '살충제초': '충초',
    '생장조정제': '생조', '생장조절제': '생조', '생장조정': '생조'
  };
  if (mapping[s]) return mapping[s];

  // 표에 없는 표기도 성분으로 판단한다 (겸용을 단일보다 먼저 본다)
  const hasG = s.indexOf('살균') >= 0;
  const hasC = s.indexOf('살충') >= 0;
  const hasJ = s.indexOf('제초') >= 0;
  if (hasG && hasC) return '균충';
  if (hasC && hasJ) return '충초';
  if (hasG) return '살균';
  if (hasC) return '살충';
  if (hasJ) return '제초';
  if (s.indexOf('생장') >= 0 || s.indexOf('생조') >= 0) return '생조';
  return s;
}

// 1. 구글 시트 데이터 로드 (Read)
// GAS 배포본이 아는 action 이름이 무엇인지 확실치 않아, 후보를 순서대로 시도한다.
// 과수원 앱(동일 배포본)에서 검증된 'readCollection'을 1순위로 둔다.
// 진단으로 확정된 action (이 GAS는 getMyPesticides 만 지원)
const READ_ACTIONS = ['getMyPesticides'];
let _workingReadAction = localStorage.getItem('pesticideReadAction') || null;

// action 하나로 읽기를 시도. 성공하면 배열, 실패하면 예외.
// GAS가 시트를 [[헤더],[행],[행]...] 2차원 배열로 넘기는 경우를 객체 배열로 변환한다.
// getMyPesticides 가 바로 이 형태이며, 변환하지 않으면 item.name 이 전부 undefined 가 된다.
function toObjects(rows) {
  if (!Array.isArray(rows) || !rows.length) return rows || [];
  if (!Array.isArray(rows[0])) return rows;        // 이미 객체 배열이면 그대로

  const head = rows[0].map(h => String(h == null ? '' : h).trim());
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!Array.isArray(r)) { out.push(r); continue; }
    const o = {};
    for (let c = 0; c < head.length; c++) { if (head[c]) o[head[c]] = r[c]; }
    out.push(o);
  }
  return out;
}

async function _tryRead(action) {
  const q = new URLSearchParams({
    action: action,
    sheetName: CURRENT_SHEET_NAME,
    collectionName: CURRENT_SHEET_NAME,   // GAS가 어느 쪽 이름을 쓰든 대응
    t: Date.now()
  });

  // ① GET 시도
  let result = null;
  try {
    const res = await fetch(`${GAS_URL_SHEETS}?${q}`, { method: 'GET', mode: 'cors' });
    result = await res.json();
  } catch (e) { result = null; }

  // ② GET이 실패하거나 거절당하면 POST로 재시도 (과수원 앱과 동일한 방식)
  if (!result || !result.success) {
    const res2 = await fetch(GAS_URL_SHEETS, { method: 'POST', body: q });
    result = await res2.json();
  }

  if (!result.success) throw new Error(result.message || '데이터 로드 실패');

  const wasMatrix = Array.isArray(result.data) && Array.isArray(result.data[0]);
  const rows = toObjects(result.data || []);
  if (rows.length) {
    console.log(`✅ ${rows.length}건 로드${wasMatrix ? ' (2차원 배열 → 객체 변환됨)' : ''}`);
    console.log('   필드:', Object.keys(rows[0]).join(', '));
  }
  return rows;
}

async function loadDataFromGoogleSheets() {
  try {
    updateSyncText('🔄 구글 시트 동기화 중...');

    // 지난번에 통한 action이 있으면 그것부터, 없으면 후보 전체를 순서대로
    const candidates = _workingReadAction
      ? [_workingReadAction, ...READ_ACTIONS.filter(a => a !== _workingReadAction)]
      : READ_ACTIONS;

    let data = null, lastErr = null;
    for (const action of candidates) {
      try {
        data = await _tryRead(action);
        if (_workingReadAction !== action) {
          _workingReadAction = action;
          localStorage.setItem('pesticideReadAction', action);
          console.log(`✅ 읽기 성공 — 이 GAS는 action='${action}' 을 사용합니다`);
        }
        break;
      } catch (e) {
        lastErr = e;
        console.warn(`… action='${action}' 실패: ${e.message}`);
      }
    }

    if (data === null) throw lastErr || new Error('모든 action 시도 실패');

    sheetsData = data;
    renderSheetsList();
    updateStats();
    updateSyncText('✅ 동기화 완료');
  } catch (err) {
    console.error('❌ 로드 에러:', err);
    // 서버가 보낸 실제 사유를 화면에 그대로 노출 — 원인 파악이 훨씬 쉬워진다
    updateSyncText('❌ ' + (err.message || '동기화 실패'));

// 2. 저장 및 수정 (Create & Update)
// ════════════════════════════════════════════════════════════
// GAS 는 시트별 전용 action 이름을 쓴다 (updateMyPesticide 등).
// 일반 이름(update)만 보내면 「알 수 없는 action」 이 난다.
// 전용 이름을 먼저 쓰고, 안 되면 일반 이름을 차례로 시도한다.
// ════════════════════════════════════════════════════════════
const SHEET_ACTIONS = {
  myPesticides: { create:'addMyPesticide', update:'updateMyPesticide', delete:'deleteMyPesticide' }
};
const ACTION_ALIASES = {
  create: ['create','add','insert','append','addRow'],
  update: ['update','updateRow','edit','modify','set','upsert'],
  delete: ['deleteRow','delete','remove','del','removeRow']
};
let _actionOk = {};

function actionCandidates(kind){
  const out = [];
  const m = SHEET_ACTIONS[CURRENT_SHEET_NAME];
  if (m && m[kind]) out.push(m[kind]);
  (ACTION_ALIASES[kind] || [kind]).forEach(a => { if (out.indexOf(a) < 0) out.push(a); });
  return out;
}

// 저장/수정/삭제 공통 — 성공한 action 이름을 기억한다
async function sendToSheet(kind, payload){
  const memo = _actionOk[kind];
  const list = memo ? [memo] : actionCandidates(kind);
  let lastMsg = '';

  for (const act of list) {
    const params = new URLSearchParams();
    params.append('action', act);
    // GAS 함수마다 받는 이름이 달라 셋 다 보낸다
    params.append('sheetName', CURRENT_SHEET_NAME);
    params.append('sheet', CURRENT_SHEET_NAME);
    params.append('collectionName', CURRENT_SHEET_NAME);
    for (const k in payload) {
      if (payload[k] !== undefined && payload[k] !== null) params.append(k, payload[k]);
    }

    try {
      const res = await fetch(GAS_URL_SHEETS, { method:'POST', body: params });
      const r = await res.json();
      if (r && r.success) {
        if (_actionOk[kind] !== act) {
          _actionOk[kind] = act;
          console.log(`✅ ${kind} → action='${act}'`);
        }
        return r;
      }
      lastMsg = (r && r.message) || '알 수 없는 응답';
    } catch (e) { lastMsg = e.message; }

    // 'action 을 모른다' 가 아니면 그 이름은 통한 것 → 더 시도하지 않는다
    if (lastMsg && !/알 수 없는 action/.test(String(lastMsg))) {
      _actionOk[kind] = act;
      throw new Error(lastMsg);
    }
    console.warn(`… action='${act}' 실패: ${lastMsg}`);
  }
  throw new Error(lastMsg || (kind + ' 실패'));
}

// ════════════════════════════════════════════════════════════
// 🔬 값조사() — 시트의 각 열에 실제로 어떤 값들이 쓰이는지 보여준다
//    status·pest_status 처럼 앱이 모르는 값이 있을 때 확인용
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
// 🧹 값정리() — 표기가 어긋난 값을 통일한다
//     값정리()      → 무엇이 바뀔지 미리보기
//     값정리(true)  → 실제 반영
// ════════════════════════════════════════════════════════════
window.값정리 = window.normalizeValues = async function (apply) {
  if (!sheetsData || !sheetsData.length) { console.warn('데이터가 없습니다'); return; }

  // 분류 표기 통일 — 시트에 더 많이 쓰인 '~제' 형태로 맞춘다
  const TYPE_MAP = {
    '살균':'살균제', '살충':'살충제', '제초':'제초제',
    '균충':'살균살충제', '충초':'살충제초제', '생조':'생장조정제'
  };
  const EMOJI = { '살균제':'🦠', '살충제':'🐛', '제초제':'🌿',
                  '살균살충제':'🧪', '살충제초제':'🧪', '생장조정제':'🌱' };

  const plan = [];
  sheetsData.forEach(function (r) {
    if (!r || !r.id) return;
    const fix = {};
    const t0 = String(r.type || '').trim();
    if (TYPE_MAP[t0]) fix.type = TYPE_MAP[t0];

    // 제 이전 버전이 덮어쓴 'active' 를 원래 값으로 되돌린다
    if (String(r.status || '').trim() === 'active') fix.status = '여유';

    // 비어 있는 것만 채운다
    if (!String(r.pest_status || '').trim()) fix.pest_status = 'have';
    const finalType = fix.type || t0;
    if (!String(r.emoji || '').trim() && EMOJI[finalType]) fix.emoji = EMOJI[finalType];

    if (Object.keys(fix).length) {
      plan.push({ id: r.id, name: r.name, 현재: 
        [t0 !== (fix.type||t0) ? 'type:'+t0 : '',
         fix.status ? 'status:active' : '',
         fix.pest_status ? 'pest_status:(빈칸)' : '',
         fix.emoji ? 'emoji:(빈칸)' : ''].filter(Boolean).join(' · '),
        변경: Object.keys(fix).map(function(k){ return k+':'+fix[k]; }).join(' · '),
        _fix: fix });
    }
  });

  console.log('%c🧹 값 통일 — 손볼 것 ' + plan.length + '건 / 전체 ' + sheetsData.length + '건',
              'color:#1565C0;font-weight:bold');
  if (!plan.length) { console.log('%c✅ 정리할 것이 없습니다', 'color:#2E7D32'); return; }
  console.table(plan.map(function (p) { return { 제품명:p.name, 현재:p.현재, 변경:p.변경 }; }));

  if (!apply) {
    console.log('%c실제로 반영하려면  값정리(true)  를 입력하세요.', 'color:#E65100;font-weight:bold');
    return plan;
  }

  let ok = 0, fail = 0;
  for (const p of plan) {
    const src = sheetsData.find(function (x) { return String(x.id) === String(p.id); }) || {};
    const payload = Object.assign({}, src, p._fix, { updatedAt: new Date().toISOString() });
    try { await sendToSheet('update', payload); ok++; }
    catch (e) { fail++; console.warn('실패:', p.name, e.message); }
  }
  console.log('🧹 완료 — 수정 ' + ok + (fail ? ', 실패 ' + fail : ''));
  loadDataFromGoogleSheets();
};

window.값조사 = window.inspectValues = function (col) {
  if (!sheetsData || !sheetsData.length) { console.warn('데이터가 없습니다'); return; }

  const cols = col ? [col]
    : ['status','pest_status','type','unit','emoji','excluded','icon','source'];

  cols.forEach(function (c) {
    const tally = {};
    sheetsData.forEach(function (r) {
      const v = (r[c] === undefined || r[c] === null || String(r[c]).trim() === '')
                ? '(빈칸)' : String(r[c]).trim();
      tally[v] = (tally[v] || 0) + 1;
    });
    const rows = Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a]; })
                   .map(function (v) { return { 값: v, 건수: tally[v] }; });
    console.log('%c▼ ' + c, 'color:#1565C0;font-weight:bold');
    console.table(rows);
  });
  console.log('%c※ 여기 나온 값을 알려주시면 앱이 그대로 쓰도록 맞춰드립니다.', 'color:#E65100');
};

  // 분류에 맞는 아이콘 (비어 있으면 자동 지정)

                      '균충':'살균살충제', '충초':'살충제초제', '생조':'생장조정제' };

                        '생장조정제':'🌱', '기타':'💊' };

  const payload = {

    type: typeFull,
    quantity: quantity,
    unit: unit,
    ingredient: ingredient,

// 6. 희석배수 20L 기준 환산 및 메모 생성 함수
function buildCropMemo(cropDetails, toxicInfo) {
  const toxicGubun = toxicInfo?.toxicGubun || toxicInfo?.toxicGrade || '-';
  const toxicName = toxicInfo?.toxicName || toxicInfo?.toxicClassName || '-';
  const fishToxic = toxicInfo?.fishToxic || toxicInfo?.fishToxicGubun || toxicInfo?.fishGrade || '-';
  
  const result = cropDetails.map(crop => {
    const cName = crop.cropName || '-';
    const dName = crop.diseaseWeedName || '-';
    const pUse = crop.pestiUse || '-';
    let dUnit = crop.dilutUnit || '-';
    const uSuit = crop.useSuittime || crop.harvestGracePeriod || crop.safetyLine || '-';
    const uNum = crop.useNum || crop.maxUseCount || '-';
    
    if (dUnit) {
      const aMatch = dUnit.match(/(?:10a|1,000㎡|1000㎡)당\s*([\d\.]+)\s*(g|kg|ml|L)/i);
      if (aMatch) {
        let val = parseFloat(aMatch[1]);
        let unitStr = aMatch[2].toLowerCase();
        if (unitStr === 'kg') { val *= 1000; unitStr = 'g'; }
        if (unitStr === 'l') { val *= 1000; unitStr = 'ml'; }
        const per20L = (val / 8).toFixed(1).replace(/\.0$/, '');
        dUnit = `${dUnit} [20L당 ${per20L}${unitStr}]`;
      } else if (dUnit.includes('배')) {
        const match = dUnit.match(/(\d+)배/);
        if (match) {
          const times = parseInt(match[1]);
          const mlFor20L = (20000 / times).toFixed(1).replace(/\.0$/, '');
          dUnit = `${dUnit} (20L당 ${mlFor20L}ml)`;
        }
      } else {
        const numMatch = dUnit.match(/([\d\.]+)\s*(g|ml)/i);
        if (numMatch && !dUnit.includes('20L')) {
          const val = parseFloat(numMatch[1]);
          const unitStr = numMatch[2].toLowerCase();
          const per20L = (val / 8).toFixed(1).replace(/\.0$/, '');
          dUnit = `${dUnit} [20L당 ${per20L}${unitStr}]`;
        }
      }
    }
    
    return `${cName}(${dName},${pUse},${dUnit},${uSuit},${uNum},${toxicGubun}(${toxicName}),${fishToxic})`;
  }).join(' / ');
  
  return result;
}

// ── PSIS 응답 파서 (서버 응답 형태가 무엇이든 목록을 찾아낸다) ──────────

// PSIS 항목이 가지고 있을 법한 필드 이름들
const PSIS_KEYS = ['pestiKorName','pestiCode','compName','cropName','diseaseWeedName',
                   'cmpaItmNm','useName','pestiUse','dilutUnit','ingredientName',
                   'pestiBrandName','diseaseUseSeq','useSuittime','useNum'];

// 객체 어디에 숨어 있든 '농약 항목 배열'을 재귀로 찾아낸다
function psisFindList(node, depth) {
  depth = depth || 0;
  if (!node || depth > 6) return null;

  if (Array.isArray(node)) {
    if (node.length && typeof node[0] === 'object' && node[0] !== null
        && PSIS_KEYS.some(k => k in node[0])) return node;
    for (const el of node) {
      const found = psisFindList(el, depth + 1);
      if (found) return found;
    }
    return null;
  }

  if (typeof node === 'object') {
    // 항목이 1개면 배열이 아니라 객체 하나로 오는 경우가 흔하다
    if (PSIS_KEYS.some(k => k in node)) return [node];
    for (const k of Object.keys(node)) {
      const found = psisFindList(node[k], depth + 1);
      if (found) return found;
    }
  }
  return null;
}

// XML 문자열로 오는 경우 대비
function psisParseXml(text) {
  try {
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if (doc.getElementsByTagName('parsererror').length) return null;
    const items = doc.getElementsByTagName('item');
    if (!items.length) return null;
    return Array.from(items).map(node => {
      const o = {};
      Array.from(node.children).forEach(c => { o[c.tagName] = (c.textContent || '').trim(); });
      return o;
    });
  } catch (e) { return null; }
}

// GAS가 아는 파라미터 이름이 target인지 action인지 불확실하므로 둘 다 시도
// GAS에 handleIndex4Search_ 함수가 이미 있으므로,
// 그것이 어떤 action 이름으로 연결돼 있는지 후보를 훑어본다.
const PSIS_PARAM_SETS = [
  { action: 'psis' },              // doGet에 2줄 추가하면 이것 (전체 목록 반환 — 권장)
  { action: 'searchPesticide' },   // GAS에 이미 존재 (요약 1건만 반환)
  { action: 'index4Search' }
];
let _workingPsisParams = null;

async function psisFetchList(keyword) {
  const base = {
    keyword: keyword,
    searchType: 'brand',
    displayCount: '50',
    startPoint: '1'
  };

  const sets = _workingPsisParams ? [_workingPsisParams, ...PSIS_PARAM_SETS] : PSIS_PARAM_SETS;
  let lastRaw = null;

  for (const extra of sets) {
    const q = new URLSearchParams({ ...base, ...extra });
    let raw = null;
    try {
      const res = await fetch(`${CONFIG_GAS_URL}?${q}`);
      const text = await res.text();
      try { raw = JSON.parse(text); }
      catch (e) { raw = psisParseXml(text) || text; }   // JSON이 아니면 XML/문자열로
    } catch (e) {
      console.warn('PSIS 요청 실패:', e.message);
      continue;
    }

    console.log('📡 PSIS 응답 (' + JSON.stringify(extra) + '):', raw);
    lastRaw = raw;

    const list = psisFindList(raw);
    if (list && list.length) {
      _workingPsisParams = extra;
      console.log(`✅ PSIS 검색 성공 — 파라미터 ${JSON.stringify(extra)}, ${list.length}건`);
      return { list: list, raw: raw };
    }
  }

  return { list: [], raw: lastRaw };
}

// 결과가 없을 때 서버 응답을 사람이 읽을 수 있게 요약
function psisDiagnose(raw) {
  if (raw == null) return '서버에서 응답이 오지 않았습니다. 네트워크를 확인해 주세요.';

  // {ok:true, data:{service:[], message:'...'}} 처럼 한 겹 안에 든 메시지도 끌어올린다
  if (typeof raw === 'object' && raw.data && typeof raw.data === 'object'
      && !raw.message && !raw.error && (raw.data.message || raw.data.error)) {
    raw = Object.assign({}, raw, { message: raw.data.message || raw.data.error });
  }

  if (typeof raw === 'string') {
    return '서버 응답(원문): <code style="word-break:break-all">'
         + raw.slice(0, 200).replace(/</g, '&lt;') + '</code>';
  }
  if (raw.success === false || raw.error || raw.message) {
    const msg = String(raw.message || raw.error);
    let extra = '';
    if (/알 수 없는 action/.test(msg)) {
      extra = '<br><b style="color:#C62828">→ Google Apps Script에 PSIS 검색 기능이 없습니다.</b>'
            + '<br><span style="color:#666">GAS에 psis 핸들러를 추가해야 합니다. '
            + 'PSIS API는 브라우저에서 직접 부를 수 없어(CORS 차단) 서버를 반드시 거쳐야 합니다.</span>';
    }
    return '서버 메시지: <b style="color:#C62828">' + msg.replace(/</g, '&lt;') + '</b>' + extra;
  }
  const keys = Object.keys(raw).slice(0, 8).join(', ');
  return '해당 제품명으로 등록된 농약이 없거나, 응답 형식이 예상과 다릅니다.<br>'
       + '응답 최상위 항목: <code>' + (keys || '(비어 있음)') + '</code><br>'
       + '<span style="color:#999">F12 콘솔의 「📡 PSIS 응답」 로그에서 전체 내용을 볼 수 있습니다.</span>';
}

      // 서버가 뭐라고 답했는지 그대로 보여준다 — 원인 파악을 위해

      resultsList.innerHTML =

        + '</div>';
      return;
    }

    // ── 독성 정보 ──────────────────────────────────────────────
    // GAS의 _psisSearch()가 내부적으로 _fetchDetail(SVC02)을 이미 호출해
    // toxicGubun / toxicName / fishToxic 을 함께 실어 보낸다.
    // 따라서 별도 요청 없이 첫 응답에서 바로 꺼내 쓴다.
    let toxicInfo = { toxicGubun: '-', toxicName: '-', fishToxic: '-' };
    const firstItem = serviceList[0] || {};

    const svc01Toxic = (gasData && gasData.data) ? gasData.data : {};
    if (svc01Toxic.toxicGubun || svc01Toxic.toxicName || svc01Toxic.fishToxic) {
      toxicInfo = {
        toxicGubun: svc01Toxic.toxicGubun || '-',
        toxicName:  svc01Toxic.toxicName  || '-',
        fishToxic:  svc01Toxic.fishToxic  || '-'
      };
      console.log('☠️ 독성 정보 (첫 응답에 포함됨):', toxicInfo);
    } else {
      // 첫 응답에 없을 때만 보조 요청 — GAS에 psisToxic 라우팅이 있어야 동작
      const pestiCode = firstItem.pestiCode || firstItem.code || '';
      if (pestiCode) {
        try {
          const q2 = new URLSearchParams({
            action: 'psisToxic',
            pestiCode: pestiCode,
            diseaseUseSeq: firstItem.diseaseUseSeq || '1'
          });
          const resSvc02 = await fetch(`${CONFIG_GAS_URL}?${q2}`);
          const toxicData = await resSvc02.json();
          if (toxicData && toxicData.data && !Array.isArray(toxicData.data)) {
            toxicInfo = toxicData.data;
            console.log('☠️ 독성 정보 (보조 요청):', toxicInfo);
          } else {
            console.info('ℹ️ 독성 정보 없음 — 표시는 "-" 로 대체됩니다 (기능에 지장 없음)');
          }
        } catch (toxicErr) {
          console.info('ℹ️ 독성 정보 조회 생략:', toxicErr.message);
        }
      }
    }

    loadingEl.style.display = 'none';

    const combinationMap = new Map();
    serviceList.forEach(item => {
      const gubun = item.cmpaItmNm || '미분류';
      const usage = item.useName || '기타';
      const compName = item.compName || item.manufacturer || '미분류';
      const ingredient = item.pestiKorName || item.ingredientName || '품목명 없음';
      const key = `${gubun}|${usage}|${compName}|${ingredient}`;

      if (!combinationMap.has(key)) {
        combinationMap.set(key, { gubun, usage, company: compName, ingredient, cropDetails: [] });
      }

      const data = combinationMap.get(key);
      const cropDetail = {
        cropName: item.cropName || '-',
        diseaseWeedName: item.diseaseWeedName || '-',
        pestiUse: item.pestiUse || '-',
        dilutUnit: item.dilutUnit || '-',
        useSuittime: item.useSuittime || item.harvestGracePeriod || item.safetyLine || '-',
        useNum: item.useNum || item.maxUseCount || '-'
      };

      if (!data.cropDetails.find(c => c.cropName === cropDetail.cropName && c.diseaseWeedName === cropDetail.diseaseWeedName)) {
        data.cropDetails.push(cropDetail);
      }
    });

    psisResultsCache = Array.from(combinationMap.values()).map(item => {
      const cropMemo = buildCropMemo(item.cropDetails, toxicInfo);
      return { ...item, cropMemo };
    });

    container.style.display = 'block';
    resultsList.innerHTML = psisResultsCache.map((item, idx) => `
      <div style="padding: 8px; border-bottom: 1px solid var(--gray-200); cursor: pointer; border-radius: 4px;" onclick="selectPsisCompany(${idx})">
        <div style="font-weight: 600; color: var(--green-dark); font-size: 12px;">🏢 ${item.company} (${item.ingredient})</div>
        <div style="font-size: 10px; color: var(--gray-600); margin-top: 2px;">구분: ${item.gubun} | 용도: ${item.usage}</div>
        <div style="font-size: 10px; color: var(--gray-500); margin-top: 2px;">✅ 메모: ${item.cropMemo}</div>
      </div>
    `).join('');

  } catch (err) {
    loadingEl.style.display = 'none';
    console.error('PSIS 및 독성 검색 실패:', err);
    alert('PSIS 검색 중 오류가 발생했습니다.\n\n' + (err && err.message ? err.message : err));
  }
}

function selectPsisCompany(idx) {
  const item = psisResultsCache[idx];
  if (!item) return;

  document.getElementById('form-manufacturer').value = item.company || '';
  document.getElementById('form-ingredient').value = item.ingredient || '';
  
  const typeMap = { '살충': '살충', '살균': '살균', '제초': '제초', '생장': '생조' };
  let matchedType = '기타';
  for (const key in typeMap) {
    if (item.usage.includes(key)) {
      matchedType = typeMap[key];
      break;
    }
  }
  document.getElementById('form-type').value = matchedType;
  document.getElementById('form-memo').value = item.cropMemo || '';
  document.getElementById('psis-results-container').style.display = 'none';
  showToast('✅ 20L 기준 환산 정보가 자동으로 채워졌습니다.');
}

// 5. UI 및 모달 제어
function renderSheetsList() {
  const listEl = document.getElementById('sheets-list');
  const countEl = document.getElementById('sheets-count');
  
  let filtered = sheetsData;
  if (currentCategory !== 'all') {
    // ⚠️ 글자 포함(includes)으로 비교하면
    //    '살균살충제' 가 살균·살충 양쪽에 걸리고 균충에는 안 걸린다.
    //    분류별 요약(updateStats)과 같은 기준인 normalizeType 을 쓴다.
    filtered = sheetsData.filter(item => normalizeType(item.type) === currentCategory);
  }

  countEl.textContent = filtered.length;

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;"><p>📦 등록된 데이터가 없습니다</p></div>';
    return;
  }

  listEl.innerHTML = filtered.map(item => `
    <div class="pesticide-card" onclick="viewPesticide('${item.id}')">
      <div class="pesticide-info">
        <div class="pesticide-name">💊 <span style="color: var(--blue-dark);">${item.name || '-'}</span></div>
        <div class="pesticide-meta">
          분류: ${item.type || '미분류'} | 수량: ${item.quantity || 0}${item.unit || '개'}
          ${item.ingredient ? '<br/>성분: ' + item.ingredient : ''}
          ${item.manufacturer ? ' | 제조사: ' + item.manufacturer : ''}
          <!-- <div class="source-badge">🟩 Google Sheets</div> -->
        </div>
      </div>
      <div class="pesticide-actions">
        <button class="btn-small" onclick="event.stopPropagation(); openEditModal('${item.id}')">수정</button>
        <button class="btn-small" onclick="event.stopPropagation(); deletePesticide('${item.id}')" style="background: #FFCDD2; color: #C62828;">삭제</button>
      </div>
    </div>
  `).join('');
}

function viewPesticide(id) {
  const item = sheetsData.find(p => String(p.id) === String(id));
  if (!item) return;

  editingId = item.id;
  isViewMode = true;
  
  document.getElementById('modal-title').textContent = '👁️ 농약 상세 조회';
  document.getElementById('form-name').value = item.name || '';
  document.getElementById('form-type').value = normalizeType(item.type || '');
  document.getElementById('form-quantity').value = item.quantity || 1;
  document.getElementById('form-unit').value = item.unit || '개';
  document.getElementById('form-ingredient').value = item.ingredient || '';
  document.getElementById('form-manufacturer').value = item.manufacturer || '';
  document.getElementById('form-memo').value = item.memo || '';

  setFieldsDisabled(true);
  document.getElementById('save-btn').textContent = '편집';
  document.getElementById('psis-btn').style.display = 'none';
  document.getElementById('psis-results-container').style.display = 'none';
  
  document.getElementById('register-modal').classList.add('active');
}

function openEditModal(id) {
  const item = sheetsData.find(p => String(p.id) === String(id));
  if (!item) return;

  editingId = item.id;
  isViewMode = false;

  document.getElementById('modal-title').textContent = '✏️ 농약 수정';
  document.getElementById('form-name').value = item.name || '';
  document.getElementById('form-type').value = normalizeType(item.type || '');
  document.getElementById('form-quantity').value = item.quantity || 1;
  document.getElementById('form-unit').value = item.unit || '개';
  document.getElementById('form-ingredient').value = item.ingredient || '';
  document.getElementById('form-manufacturer').value = item.manufacturer || '';
  document.getElementById('form-memo').value = item.memo || '';

  setFieldsDisabled(false);
  document.getElementById('save-btn').textContent = '저장';
  document.getElementById('psis-btn').style.display = 'inline-block';
  
  document.getElementById('register-modal').classList.add('active');
}

function enableEditMode() {
  isViewMode = false;
  setFieldsDisabled(false);
  document.getElementById('modal-title').textContent = '✏️ 농약 수정';
  document.getElementById('save-btn').textContent = '저장';
  document.getElementById('psis-btn').style.display = 'inline-block';
}

function setFieldsDisabled(disabled) {
  document.getElementById('form-name').disabled = disabled;
  document.getElementById('form-type').disabled = disabled;
  document.getElementById('form-quantity').disabled = disabled;
  document.getElementById('form-unit').disabled = disabled;
  document.getElementById('form-ingredient').disabled = disabled;
  document.getElementById('form-manufacturer').disabled = disabled;
  document.getElementById('form-memo').disabled = disabled;
}

function openRegisterModal() {
  editingId = null;
  isViewMode = false;
  document.getElementById('modal-title').textContent = '🧪 새 농약 등록';
  document.getElementById('form-name').value = '';
  document.getElementById('form-type').value = '';
  document.getElementById('form-quantity').value = '1';
  document.getElementById('form-unit').value = '개';
  document.getElementById('form-ingredient').value = '';
  document.getElementById('form-manufacturer').value = '';
  document.getElementById('form-memo').value = '';

  setFieldsDisabled(false);
  document.getElementById('save-btn').textContent = '저장';
  document.getElementById('psis-btn').style.display = 'inline-block';
  document.getElementById('psis-results-container').style.display = 'none';
  document.getElementById('register-modal').classList.add('active');
}

function closeRegisterModal() {
  document.getElementById('register-modal').classList.remove('active');
}

function filterByCategory(category) {
  currentCategory = category;
  document.querySelectorAll('.category-tab').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`[data-category="${category}"]`).classList.add('active');
  renderSheetsList();
}

// 상단 통계 업데이트 함수 (보유농약 27개 유지 + 분류별 개수 집계 표시)
function updateStats() {
  try {
    const statSheets = document.getElementById('stat-sheets');
    const statDetailBox = document.getElementById('stat-category-details');
    
    const totalCount = sheetsData ? sheetsData.length : 0;
    if (statSheets) statSheets.textContent = totalCount;
    
    if (statDetailBox) {
      // 분류별 갯수 카운트 객체 생성
      const counts = {};
      const categories = ['살균', '살충', '제초', '균충', '충초', '생조', '기타'];
      
      categories.forEach(cat => counts[cat] = 0);
      
      if (sheetsData && sheetsData.length > 0) {
        sheetsData.forEach(item => {
          const t = normalizeType(item.type || '');
          let matched = false;
          categories.forEach(cat => {
            if (t.includes(cat)) {
              counts[cat]++;
              matched = true;
            }
          });
          if (!matched) {
            counts['기타']++;
          }
        });
      }
      
      // HTML 태그로 조합하여 출력 (0개인 항목도 포함하거나 0 초과인 것만 깔끔하게 표시)
      let html = '';
      categories.forEach(cat => {
        html += `<div class="stat-detail-item"><strong>${cat}</strong>: ${counts[cat]}개</div>`;
      });
      statDetailBox.innerHTML = html;
    }
    
    console.log('✅ updateStats() 완료 (분류별 요약 반영)');
  } catch (err) {
    console.error('❌ updateStats() 오류:', err.message);
  }
}

function updateSyncText(msg) {
  const syncText = document.getElementById('sync-text');
  if (syncText) syncText.textContent = msg;
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

document.addEventListener('DOMContentLoaded', () => {
  loadDataFromGoogleSheets();
});
